<style>
:root{
  --ink:#172B31;
  --ink-deep:#0F1F24;
  --ink-line:#2C4249;
  --teal:#2AADA5;
  --teal-dark:#248782;
  --white:#FFFFFF;
  --mute:#8FA3A8;
  --faint:#5C7178;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--white);
  font-family:"Noto Kufi Arabic","Archivo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:24px 18px 40px;
}
.num{font-family:"Archivo",sans-serif;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.wrap{width:100%;max-width:420px;margin:auto 0}

.langbar{width:100%;max-width:420px;display:flex;justify-content:flex-end;gap:4px;margin-bottom:20px}
.langbar button{
  background:none;border:0;color:var(--faint);font:500 12px "Archivo",sans-serif;
  padding:6px 10px;border-radius:6px;cursor:pointer;font-family:inherit;
}
.langbar button[aria-pressed="true"]{color:var(--teal);background:var(--ink-deep)}

.brand{text-align:center;padding:18px 0 26px}
.brand h1{font:600 21px "Archivo",sans-serif;letter-spacing:1.5px;color:var(--white)}
.brand .rule{width:30px;height:2px;background:var(--teal);margin:11px auto 0}

h2{font-size:17px;font-weight:500;text-align:center;margin-bottom:7px;line-height:1.5}
.sub{color:var(--mute);font-size:13px;text-align:center;line-height:1.8;margin-bottom:26px}

label{display:block;color:var(--mute);font-size:12px;margin-bottom:6px}
input{
  width:100%;height:46px;background:var(--ink-deep);
  border:1px solid var(--ink-line);border-radius:var(--radius);
  color:var(--white);font:500 16px "Archivo",sans-serif;
  padding:0 14px;direction:ltr;text-align:right;outline:none;
  transition:border-color .15s;
}
input:focus{border-color:var(--teal)}
input::placeholder{color:#3E545B}
.field{margin-bottom:16px}

button.go{
  width:100%;height:48px;background:var(--teal);border:0;border-radius:var(--radius);
  color:#06282B;font:600 15px inherit;cursor:pointer;transition:background .15s;
  font-family:inherit;
}
button.go:hover:not(:disabled){background:var(--teal-dark)}
button.go:disabled{opacity:.5;cursor:default}

.hint{color:var(--faint);font-size:12px;text-align:center;margin-top:16px;line-height:1.8}
.err{
  background:rgba(226,75,74,.1);border:1px solid rgba(226,75,74,.35);
  color:#F09595;font-size:13px;border-radius:var(--radius);
  padding:12px 14px;margin-bottom:16px;line-height:1.7;
}
.hidden{display:none}
@keyframes spo-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spo-dr{0%{transform:translateX(0)}100%{transform:translateX(400px)}}
@keyframes spo-rl{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes spo-ps{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spo-ld{0%{transform:translateY(-36px);opacity:0}55%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes spo-gw{0%,100%{r:3}50%{r:7}}
.scene{background:var(--ink-deep);border-radius:12px;height:148px;margin-bottom:18px;overflow:hidden}
.scene svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}}


.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.head .user{font-size:14px;font-weight:500}
.head .code{color:var(--teal);font-size:13px}

.money{background:var(--ink-deep);border-radius:14px;padding:16px;margin-bottom:20px}
.money .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:9px}
.money .row span:last-child{color:#C9D6D9}
.money .sep{border-bottom:1px solid var(--ink-line);padding-bottom:11px;margin-bottom:11px}
.money .due{display:flex;justify-content:space-between;align-items:baseline}
.money .due .lbl{font-size:14px;font-weight:500;color:var(--white)}
.money .due .val{font-size:23px;font-weight:600;color:var(--teal)}
.money .note{color:var(--faint);font-size:11.5px;margin-top:4px}

.tl{padding-inline-start:3px}
.step{display:flex;gap:13px}
.step .gut{display:flex;flex-direction:column;align-items:center;width:14px;flex-shrink:0}
.dot{width:9px;height:9px;border-radius:50%;background:transparent;border:1px solid var(--ink-line);margin-top:5px}
.step.done .dot{background:var(--teal);border-color:var(--teal)}
.step.now .dot{width:14px;height:14px;background:var(--teal);border-color:var(--teal);margin-top:3px;
  display:flex;align-items:center;justify-content:center}
.step.now .dot::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink)}
.line{width:1px;flex:1;min-height:17px;background:var(--ink-line)}
.step.done .line{background:var(--teal-dark)}
.step .body{padding-bottom:15px}
.step .t{font-size:13px;color:var(--faint)}
.step.done .t{color:#C9D6D9}
.step.now .t{color:var(--white);font-size:14px;font-weight:500}
.step .d{font-size:11.5px;color:var(--faint);margin-top:2px}
.step.now .d{color:var(--teal)}
.step:last-child .line{display:none}
.step:last-child .body{padding-bottom:0}

.foot{border-top:1px solid var(--ink-line);margin-top:20px;padding-top:14px;
  display:flex;justify-content:space-between;align-items:center}
.foot .upd{color:var(--faint);font-size:11.5px}
.foot button{background:none;border:0;color:var(--teal);font:500 13px inherit;cursor:pointer;font-family:inherit}

.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(6,40,43,.3);
  border-top-color:#06282B;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>
</head>

      <button id="again" data-t="again"></button>

  </section>
</div>

  const d = new Date(iso);
  return d.toLocaleDateString(lang === "ar" ? "ar-IQ" : "en-GB",
    {day:"numeric", month:"short"});
}

function showError(msg){
  const e = $("err");
  e.textContent = msg;
  e.classList.remove("hidden");
}

function render(o){
  window._last = o;
  const t = T[lang];

  $("r-user").textContent = o.username || "";
  $("r-code").textContent = o.order_code;
  $("r-total").textContent = iqd(o.total_iqd);
  $("r-paid").textContent = "− " + iqd(o.deposit_iqd);
  $("r-due").textContent = iqd(o.balance_iqd);
  $("r-note").textContent = o.balance_iqd > 0 ? t.cash : t.settled;

  const seen = {};
  (o.history || []).forEach(h => { if (!seen[h.status]) seen[h.status] = h.at; });

  $("r-scene").innerHTML = SCENES[o.status] || SCENES.received;

  // Four stops, same as the admin panel: purchased and in_transit fold into
  // the stop before them, and the last stop covers the delivery hand-off.
  const TL = [
    { covers: ["received", "purchased"],         label: t.st.received },
    { covers: ["at_dubai", "in_transit"],        label: t.st.at_dubai },
    { covers: ["at_erbil"],                      label: t.st.at_erbil },
    { covers: ["out_for_delivery", "delivered"], label: `${t.st.out_for_delivery} + ${t.st.delivered}` }
  ];
  const reached = TL.findIndex(x => x.covers.includes(o.status));
  const tl = $("r-timeline");
  tl.innerHTML = "";

  TL.forEach((x, i) => {
    const div = document.createElement("div");
    div.className = "step" + (i < reached ? " done" : i === reached ? " now" : "");
    const meta = i === reached ? t.now : "";

    const gut = document.createElement("div");
    gut.className = "gut";
    const dot = document.createElement("div"); dot.className = "dot";
    const line = document.createElement("div"); line.className = "line";
    gut.append(dot, line);

    const body = document.createElement("div");
    body.className = "body";
    const title = document.createElement("div");
    title.className = "t"; title.textContent = x.label;
    body.append(title);
    if (meta){
      const d = document.createElement("div");
      d.className = "d"; d.textContent = meta;
      body.append(d);
    }

    div.append(gut, body);
    tl.append(div);
  });

  $("r-upd").textContent = "";
  $("form-view").classList.add("hidden");
  $("result-view").classList.remove("hidden");
  window.scrollTo(0, 0);
}

async function lookup(){
  const t = T[lang];
  $("err").classList.add("hidden");

  const AR = "٠١٢٣٤٥٦٧٨٩", FA = "۰۱۲۳۴۵۶۷۸۹";
  const en = t => String(t).replace(/[٠-٩۰-۹]/g, d => {
    const i = AR.indexOf(d); return i > -1 ? i : FA.indexOf(d);
  });
  let code = en($("code").value.trim());
  let last4 = en($("last4").value.trim());

  if (!code || last4.length !== 4){ showError(t.empty); return; }

  const btn = $("submit");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';

  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/track_order", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ p_code: code, p_last4: last4 })
    });
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    if (!rows || !rows.length){ showError(t.notfound); return; }
    render(rows[0]);
  } catch (e) {
    showError(t.neterr);
  } finally {
    btn.disabled = false;
    btn.textContent = t.cta;
  }
}

$("submit").addEventListener("click", lookup);
$("last4").addEventListener("keydown", e => { if (e.key === "Enter") lookup(); });
$("code").addEventListener("keydown", e => { if (e.key === "Enter") $("last4").focus(); });
$("again").addEventListener("click", () => {
  $("result-view").classList.add("hidden");
  $("form-view").classList.remove("hidden");
  $("code").value = ""; $("last4").value = "";
  $("code").focus();
});
["ku","ar"].forEach(l => $(l).addEventListener("click", () => {
  lang = l; localStorage.setItem("spo_lang", l); applyLang();
}));

applyLang();
</script>
</body>
</html>

function renderShko(){
  const allOpen = skRows.filter(r => !r.received);
  const allRecv = skRows.filter(r => r.received);
  const q = toEn($("sk-q").value || "").trim().toLowerCase();
  // amount lookup kicks in from 4 digits so short queries stay code searches
  const qd = q.replace(/[,،٫٬.\s]/g, "");
  const byAmount = qd.length >= 4 && /^\d+$/.test(qd);
  const hit = r => !q
    || String(r.seq).includes(q)
    || `${r.cycle_code}-${String(r.seq).padStart(4, "0")}`.includes(q)
    || (r.username || "").toLowerCase().includes(q)
    || (byAmount && String(r.amount_iqd || 0).startsWith(qd))
    || (byAmount && String(r.orders?.customers?.phone || "").replace(/\D/g, "").includes(qd));
  const open = allOpen.filter(hit);
  const recv = allRecv.filter(hit);
  const sum = a => a.reduce((x, r) => x + Number(r.amount_iqd || 0), 0);
  $("sk-remaining").textContent = iqd(sum(allOpen));
  $("sk-remaining-sub").textContent = `${allOpen.length} ${t().orders}`;
  const ym = d => String(d).slice(0, 7);
  $("sk-all").textContent = iqd(sum(allRecv));
  $("sk-list").innerHTML = open.length ? open.map(r => shipRow(r, false)).join("")
    : `<div style="color:var(--faint);font-size:12.5px">${t().shkoEmpty}</div>`;
  const m = {};
  allRecv.forEach(r => { if (r.received_at){ const k = ym(r.received_at); m[k] = (m[k] || 0) + Number(r.amount_iqd || 0); } });
  $("sk-months").innerHTML = Object.keys(m).sort().reverse().map(k =>
    `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(44,66,73,.5)">
       <span class="num" dir="ltr">${k}</span><span class="num" style="color:var(--teal)">${iqd(m[k])}</span></div>`).join("");
  $("sk-open-n").textContent = `${open.length} ${t().shkoShipN}`;
  $("sk-clear-open").classList.toggle("hide", !open.length);
  $("sk-recv-n").textContent = recv.length ? `${recv.length} ${t().shkoRecvN}` : `0 ${t().shkoRecvN}`;
  $("sk-clear").classList.toggle("hide", !recv.length);
  $("sk-recv").innerHTML = recv.slice(0, 80).map(r => shipRow(r, true)).join("");
  wireShko();
}

function wireShko(){
  document.querySelectorAll("[data-tick]").forEach(b => b.onclick = async () => {
    const id = b.dataset.tick, undo = b.dataset.done === "1";
    const r = skRows.find(x => String(x.id) === id);
    b.disabled = true;
    const { error } = await db.from("shipments").update(
      undo ? { received: false, received_at: null }
           : { received: true, received_at: new Date().toISOString() }).eq("id", id);
    if (error){ b.disabled = false; return say("sk-msg", error.message, "err"); }
    if (!undo && r?.order_id){
      // money back from SHKO = delivered, and cash collected (fills a blank only)
      await db.from("orders").update({ status: "delivered" }).eq("id", r.order_id)
        .in("status", ["received", "purchased", "at_dubai", "in_transit", "at_erbil", "out_for_delivery"]);
      if (hasCollect)
        await db.from("orders").update({ collected_iqd: r.amount_iqd })
          .eq("id", r.order_id).is("collected_iqd", null);
    }
    loadShko();
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const r = skRows.find(x => String(x.id) === b.dataset.del);
    if (!r) return;
    if (!confirm(`${r.cycle_code}-${String(r.seq).padStart(4, "0")} — ${t().shkoDel}?`)) return;
    b.disabled = true;
    if (r.image_path) await db.storage.from("labels").remove([r.image_path]);
    const { error } = await db.from("shipments").delete().eq("id", r.id);
    if (error){ b.disabled = false; return say("sk-msg", error.message, "err"); }
    loadShko();
  });
  document.querySelectorAll("[data-att]").forEach(b => b.onclick = () => {
    skAttachId = b.dataset.att; $("sk-file").click();
  });
  document.querySelectorAll("[data-imgdel]").forEach(b => b.onclick = async () => {
    const r = skRows.find(x => String(x.id) === b.dataset.imgdel);
    if (!r?.image_path) return;
    if (!confirm(`${t().shkoImgDel}?`)) return;
    b.disabled = true;
    await db.storage.from("labels").remove([r.image_path]);
    const { error } = await db.from("shipments").update({ image_path: null }).eq("id", r.id);
    if (error){ b.disabled = false; return say("sk-msg", error.message, "err"); }
    loadShko();
  });
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = async () => {
    const r = skRows.find(x => String(x.id) === b.dataset.view);
    if (!r?.image_path) return;
    const { data } = await db.storage.from("labels").createSignedUrl(r.image_path, 3600);
    if (data?.signedUrl) window.open(data.signedUrl, "_blank");
  });
}

async function clearShkoBulk(rows, btn, word){
  if (!rows.length) return;
  if (!confirm(`${rows.length} ${word} — ${t().shkoClearAll}?`)) return;
  btn.disabled = true;
  const paths = rows.filter(r => r.image_path).map(r => r.image_path);
  for (let i = 0; i < paths.length; i += 100)
    await db.storage.from("labels").remove(paths.slice(i, i + 100));
  const ids = rows.map(r => r.id);
  for (let i = 0; i < ids.length; i += 200){
    const { error } = await db.from("shipments").delete().in("id", ids.slice(i, i + 200));
    if (error){ btn.disabled = false; return say("sk-msg", error.message, "err"); }
  }
  btn.disabled = false;
  say("sk-msg", t().saved, "ok");
  loadShko();
}
const clearShkoRecv = () => clearShkoBulk(skRows.filter(r => r.received), $("sk-clear"), t().shkoRecvN);
const clearShkoOpen = () => clearShkoBulk(skRows.filter(r => !r.received), $("sk-clear-open"), t().shkoShipN);

async function skUpload(e){
  const f = e.target.files[0]; e.target.value = "";

  await db.from("shipments").update({ image_path: path }).eq("id", r.id);
  say("sk-msg", t().saved, "ok");
  loadShko();
}

const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213",
"221312","231212","112232","122132","122231","113222","123122","123221","223211","221132",

"212123","212321","232121","111323","131123","131321","112313","132113","132311","211313",
"231113","231311","112133","112331","132131","113123","113321","133121","313121","211331",
"231131","213113","213311","213131","311123","311321","331121","312113","312311","332111",
"314111","221411","431111","111224","111422","121124","121421","141122","141221","112214",
"112412","122114","122411","142112","142211","241211","221114","413111","241112","134111",
"111242","121142","121241","114212","124112","124211","411212","421112","421211","212141",
"214121","412121","111143","111341","131141","114113","114311","411113","411311","113141",

function lbBarcodeSvg(digits, wmm, hmm){
  const vals = [105];                                  // Set C: two digits per symbol
  for (let i = 0; i < digits.length; i += 2) vals.push(+digits.slice(i, i + 2));
  let chk = vals[0];
  for (let i = 1; i < vals.length; i++) chk += i * vals[i];
  vals.push(chk % 103, 106);
  const seq = vals.map(v => C128[v]).join("");
  const total = [...seq].reduce((a, c) => a + +c, 0);
  const unit = wmm / total;
  let x = 0, dark = true, bars = "";
  for (const c of seq){
    const w = +c * unit;
    if (dark) bars += `<rect x="${x.toFixed(3)}" y="0" width="${w.toFixed(3)}" height="${hmm}" fill="#000"/>`;
    x += w; dark = !dark;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${wmm}mm" height="${hmm}mm" viewBox="0 0 ${wmm} ${hmm}" shape-rendering="crispEdges">${bars}</svg>`;
}

const lbEsc = v => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const lbFit = (txt, base, steps) => {          // shrink long values instead of clipping
  const n = String(txt || "").length;
  for (const [len, size] of steps) if (n > len) return size;
  return base;
};

function lbOne(cyc, o){
  const wb = `${cyc}${String(o.seq).padStart(4, "0")}`;
  const name = o.customers?.instagram_username || "—";
  const phone = o.customers?.phone ? "0" + o.customers.phone : "—";
  const addr = (o.customers?.address || "—").replace(/\s+/g, " ").trim();
  const city = govOf(addr) || "—";
  const today = new Date().toLocaleDateString("en-GB").replace(/\//g, "-");
  const nameF = lbFit(name, "4mm", [[21, "2.2mm"], [17, "2.5mm"], [14, "2.8mm"], [11, "3.1mm"], [9, "3.5mm"]]);
  const addrF = lbFit(addr, "4mm", [[55, "2.7mm"], [38, "3.1mm"], [24, "3.6mm"]]);
  return `<div class="lb">
    <div class="top">

function lbParse(txt){
  const out = new Set();
  toEn(String(txt || "")).split(/[\s,+]+/).forEach(tok => {
    const m = tok.match(/^(\d{1,4})-(\d{1,4})$/);
    if (m){ for (let i = +m[1]; i <= +m[2] && i - +m[1] < 1000; i++) out.add(i); }
    else if (/^\d{1,4}$/.test(tok)) out.add(+tok);
  });
  return [...out];
}

async function lbAddCodes(){
  const seqs = lbParse($("lb-codes").value);
  if (!seqs.length) return;
  const { data, error } = await db.from("orders")
    .select("seq,order_code,balance_iqd,status,customers(instagram_username,phone,address)")
    .eq("cycle_code", $("lb-cycle").value).in("seq", seqs);
  if (error) return say("lb-msg", error.message, "err");
  (data || []).forEach(o => lbSel.set(Number(o.seq), o));
  const found = new Set((data || []).map(o => Number(o.seq)));
  const miss = seqs.filter(q => !found.has(q));
  if (miss.length) say("lb-msg", `${t().scNoOrder}: ${miss.join(" ")}`, "err");
  $("lb-codes").value = "";
  lbRender();
}

const lbScript = src => new Promise((res, rej) => {
  const sc = document.createElement("script");
  sc.src = src; sc.onload = res; sc.onerror = rej;
  document.head.appendChild(sc);
});

function lbDoc(rows, cyc){

    rows.map(o => lbOne(cyc, o)).join("") + "</body></html>";
}

// PDF for the 4barcode workflow on the Mac: each label rendered by the browser
// (Arabic shaping, logos, barcode) then rasterised at print resolution into a
// 100x100mm page.
async function lbPdf(){
  const rows = [...lbSel.values()].sort((a, b) => a.seq - b.seq);
  if (!rows.length) return;
  const b = $("lb-pdf"); b.disabled = true;
  try {
    if (!window.jspdf) await lbScript("https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js");
    const cyc = $("lb-cycle").value;
    // Capture happens INSIDE the same isolated iframe the print path uses —
    // rendered by its own stylesheet, untouched by the RTL admin page.
    const fr = $("lb-frame");
    fr.style.cssText = "position:fixed;left:-10000px;top:0;width:420px;height:460px;visibility:visible;border:0";
    await new Promise(r => { fr.onload = r; fr.srcdoc = lbDoc(rows, cyc); });
    const cd = fr.contentDocument, cw = fr.contentWindow;
    await new Promise((res, rej) => {
      const sc = cd.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
      sc.onload = res; sc.onerror = rej; cd.head.appendChild(sc);
    });
    await Promise.all([...cd.images].map(im => im.complete ? 1 :
      new Promise(r => { im.onload = r; im.onerror = r; })));
    // let the hidden iframe finish layout (rAF is throttled off-screen, so a
    // plain delay + the blank-retry below are the reliable combination)
    await new Promise(r => setTimeout(r, 300));
    const blank = cv => {                       // refuse to save white pages
      const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
      let dark = 0; for (let i = 0; i < d.length; i += 160) if (d[i] < 120) dark++;
      return dark < d.length / 160 * 0.01;
    };
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: [100, 100] });
    const els = [...cd.querySelectorAll(".lb")];
    if (els.length !== rows.length) throw new Error(`render ${els.length}/${rows.length}`);
    for (let i = 0; i < els.length; i++){
      say("lb-msg", `PDF ${i + 1} / ${els.length}`, "ok", 0);
      let cv = await cw.html2canvas(els[i], { scale: 4, backgroundColor: "#ffffff", logging: false });
      if (blank(cv)){
        await new Promise(r => setTimeout(r, 350));
        cv = await cw.html2canvas(els[i], { scale: 4, backgroundColor: "#ffffff", logging: false });
        if (blank(cv)) throw new Error("blank render — try again");
      }
      if (i) doc.addPage([100, 100]);
      doc.addImage(cv.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 100, 100);
    }
    doc.save(`labels_${cyc}_${rows[0].seq}-${rows[rows.length - 1].seq}.pdf`);
    say("lb-msg", `✓ PDF · ${rows.length}`, "ok");
    fr.style.cssText = "display:none";
  } catch (e){ say("lb-msg", e.message, "err"); }
  b.disabled = false;
}

function lbPrint(){
  const rows = [...lbSel.values()].sort((a, b) => a.seq - b.seq);
  if (!rows.length) return;
  const cyc = $("lb-cycle").value;
  const fr = $("lb-frame");
  fr.style.cssText = "display:none";
  fr.srcdoc = lbDoc(rows, cyc);
  fr.onload = () => {
    const img = fr.contentDocument.querySelector("img");
    const go = () => setTimeout(() => { fr.contentWindow.focus(); fr.contentWindow.print(); }, 150);
    if (img && !img.complete){ img.onload = go; img.onerror = go; } else go();
  };
}

async function loadCost(){

    db.from("cost_settings").select("key,value"),
    db.from("expenses").select("*").eq("cycle_code", cyc).order("id"),
    db.from("orders").select("status,total_iqd,weight_kg,customers(address)").eq("cycle_code", cyc)
  ]);

  ctExp = ex.data || [];
  ctOrders = os.data || [];
  // the fixed 2,331,000 writes itself into every month that has orders
  if (ctOrders.length && !ctExp.some(e => e.category === "fixed")){
    const tpl = ctSet.fixed_monthly || [];
    if (tpl.length){
      const { error: fe } = await db.from("expenses").insert(tpl.map(f =>
        ({ cycle_code: cyc, category: "fixed", label: f.label, amount_iqd: f.amount })));

  renderCost();
}

// Costs are what the receipts say, nothing estimated: every line is typed in
// (or imported from the courier's file). The only computed figure is revenue.
function ctAuto(){
  const live = ctOrders.filter(o => o.status !== "cancelled");
  return { revenue: live.reduce((a, o) => a + Number(o.total_iqd || 0), 0) };
}

// SHKO statement import: any csv/xlsx layout works — the fee column is chosen
// by eye, the system sums it and saves the month's delivery cost.
let ctFileRows = null, ctFileName = "";
async function ctParseFile(e){
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  ctFileName = f.name;
  try {
    if (/\.pdf$/i.test(f.name)){
      ctFileRows = await ctParsePdf(f);
    } else if (/\.(xlsx|xls)$/i.test(f.name)){
      if (!window.XLSX) await new Promise((res, rej) => {
        const sc = document.createElement("script");
        sc.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
        sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
      });
      const wb = XLSX.read(await f.arrayBuffer());
      ctFileRows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" });
    } else {
      const txt = await f.text();
      ctFileRows = txt.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(/[,\t;]/));
    }
  } catch (err){ return say("ct-msg", err.message, "err"); }
  renderFilePrev();
}

// PDF statements: pdf.js gives every text piece with its position; lines are
// rebuilt by Y, columns by clustering the X positions the table repeats.
async function ctParsePdf(f){
  if (!window.pdfjsLib){
    await new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
      sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
    });
    const w = await fetch("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([await w.text()], { type: "text/javascript" }));
  }
  const doc = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
  const rows = [];
  for (let pn = 1; pn <= doc.numPages; pn++){
    const page = await doc.getPage(pn);
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str.trim())
      .map(it => ({ s: it.str.trim(), x: it.transform[4], y: it.transform[5] }));
    // lines: same Y within a small tolerance
    const lines = [];
    items.sort((a, b) => b.y - a.y || a.x - b.x).forEach(it => {
      const L = lines.find(l => Math.abs(l.y - it.y) < 4);
      if (L){ L.items.push(it); L.y = (L.y + it.y) / 2; }
      else lines.push({ y: it.y, items: [it] });
    });
    // column boundaries: X positions that repeat across many lines
    const xs = {};
    lines.forEach(l => l.items.forEach(it => { const k = Math.round(it.x / 8) * 8; xs[k] = (xs[k] || 0) + 1; }));
    // neighbouring clusters are the same column drifting a few pixels
    const merged = [];
    Object.keys(xs).map(Number).sort((a, b) => a - b).forEach(x => {
      const M = merged[merged.length - 1];
      if (M && x - M.hi <= 16){ M.hi = x; M.c += xs[x]; }
      else merged.push({ lo: x, hi: x, c: xs[x] });
    });
    const need = Math.max(3, lines.length * 0.3);
    const bounds = merged.filter(m => m.c >= need).map(m => m.lo).sort((a, b) => a - b);
    lines.forEach(l => {
      l.items.sort((a, b) => a.x - b.x);
      if (bounds.length >= 2){
        const cells = bounds.map(() => "");
        l.items.forEach(it => {
          let bi = 0;
          for (let i = 0; i < bounds.length; i++) if (it.x >= bounds[i] - 12) bi = i;
          cells[bi] = (cells[bi] ? cells[bi] + " " : "") + it.s;
        });
        rows.push(cells);
      } else rows.push(l.items.map(it => it.s));
    });
  }
  return rows;
}

function ctSumCol(i){
  // A cell only counts when it IS a number. "المجموع6,797,000" and
  // "الهاتف07503094092" are text with digits inside — not money — and a
  // digit run longer than 9 is a phone, never a fee.
  let sum = 0, n = 0, mixed = 0;
  ctFileRows.forEach(r => {
    const raw = toEn(String(r[i] ?? "")).trim();
    if (!raw) return;
    if (!/^[\d.,\s]+$/.test(raw)){ if (/\d/.test(raw)) mixed++; return; }
    const v = parseFloat(raw.replace(/[\s,]/g, ""));
    if (!isFinite(v) || v === 0) return;
    if (String(Math.round(v)).length > 9) return;
    sum += v; n++;
  });
  sum = Math.round(sum);
  $("ct-file-sum").innerHTML = `<span class="num" style="color:var(--teal);font-weight:700;font-size:16px">${iqd(sum)}</span>
    <span style="color:var(--mute);font-size:12px"> · ${n} ${t().rowsN}${mixed ? ` · ⚠ ${mixed}` : ""}</span>
    <button class="btn" id="ct-file-save" style="margin-top:10px">${t().saveCost}</button>`;
  $("ct-file-save").onclick = async () => {
    const { error } = await db.from("expenses").insert({
      cycle_code: $("ct-cycle").value, category: "shko",
      label: ctFileName, qty: n, amount_iqd: sum, note: `col ${i + 1}` });
    if (error) return say("ct-msg", error.message, "err");
    ctFileRows = null; $("ct-file-prev").innerHTML = "";
    say("ct-msg", t().saved, "ok");
    loadCost();
  };
}

// A shipment in the SHKO list means the parcel left with the courier, so the
// order itself moves to out_for_delivery — but only forward: orders already
// out, delivered or cancelled are left untouched.
async function markOutForDelivery(orderIds){
  if (!orderIds.length) return 0;
  const EARLY = ["received", "purchased", "at_dubai", "in_transit", "at_erbil"];
  const { data, error } = await db.from("orders")
    .update({ status: "out_for_delivery" })
    .in("id", orderIds).in("status", EARLY).select("id");
  if (error){ console.error("markOutForDelivery", error); return 0; }
  return (data || []).length;
}

// ---- label-photo scan: read the customer code off each label, exactly like
// the bag scanner. Amount + username come from the order, not from the photo.
let sk2Rows = [], sk2Fails = [], sk2Idx = 0, sk2Url = null, sk2Orders = {};

// Everything on the label that is NOT the customer code is longer digits:
// waybill (8), phones (11), amounts (5+ once commas drop), and the date.
function shkoExtract(txt, valid, cyc){
  let up = toEn(String(txt || "")).replace(/[|]/g, "1");
  // Our own labels carry the waybill as big spaced digits: 2 6 0 8 0 1 8 9.
  // cycle + a valid 4-digit code is unmistakable — read it first.
  if (cyc){
    const re = new RegExp(cyc.split("").join("[\\s.,-]*") +
      "[\\s.,-]*(\\d)[\\s.,-]*(\\d)[\\s.,-]*(\\d)[\\s.,-]*(\\d)(?!\\s*\\d)", "g");
    const hits = new Set();
    let m;
    while ((m = re.exec(up)) !== null){
      const n = parseInt(m[1] + m[2] + m[3] + m[4], 10);
      if (n > 0 && valid.has(n)) hits.add(n);
    }
    if (hits.size === 1) return [...hits];
  }
  up = up.replace(/[,\.]/g, "");
  up = up.replace(/\b\d{1,2}\s*[-–—\/]\s*\d{1,2}\s*[-–—\/]\s*\d{2,4}\b/g, " ");  // dates
  up = up.replace(/\d{5,}/g, " ");                                              // long runs
  const cands = [...new Set((up.match(/\b\d{1,4}\b/g) || [])
    .map(n => parseInt(n, 10)).filter(n => n > 0 && n <= MAX_SEQ && valid.has(n)))];
  return cands;
}

// The customer code is printed bigger than every other number on the label —
// so among OCR'd digit-words that match a real customer, the tallest wins.
function shkoPick(data, valid, cyc){
  // OCR splits big numbers into pieces ("1" "89"), so judge whole LINES:
  // join each line's digits — the customer code line yields exactly the code,
  // the waybill line yields cycle+code, and mixed lines melt into garbage.
  const cands = {};
  let wbHit = null;
  (data.lines || []).forEach(l => {
    const digits = toEn(String(l.text || "")).replace(/[^\d]/g, "");
    const h = l.bbox ? (l.bbox.y1 - l.bbox.y0) : 0;
    if (cyc && digits.length === 8 && digits.startsWith(cyc)){
      const n = parseInt(digits.slice(4), 10);
      if (valid.has(n)) wbHit = n;
    }
    if (/^\d{1,4}$/.test(digits)){
      const n = parseInt(digits, 10);
      if (valid.has(n)) cands[n] = Math.max(cands[n] || 0, h);
    }
  });
  if (wbHit != null) return { hit: wbHit, guess: null };
  const ranked = Object.entries(cands).map(([n, h]) => ({ n: +n, h })).sort((a, b) => b.h - a.h);
  if (!ranked.length){
    const wb = shkoExtract(data.text || "", valid, cyc);
    return { hit: wb.length === 1 ? wb[0] : null, guess: wb[0] ?? null };
  }
  if (ranked.length === 1) return { hit: ranked[0].n, guess: null };
  if (ranked[0].h >= ranked[1].h * 1.35) return { hit: ranked[0].n, guess: null };
  return { hit: null, guess: ranked[0].n };
}

// -- bench-proven photo pipeline (15/20 on the degradation matrix vs 10/20) --
function skScale(src, w){
  const sc = Math.min(1, w / src.width);
  const cv = document.createElement("canvas");
  cv.width = Math.max(2, Math.round(src.width * sc));
  cv.height = Math.max(2, Math.round(src.height * sc));
  cv.getContext("2d").drawImage(src, 0, 0, cv.width, cv.height);
  return cv;
}
function skGrey(cv){                       // in place; returns histogram
  const cx = cv.getContext("2d", { willReadFrequently: true });
  const im = cx.getImageData(0, 0, cv.width, cv.height), d = im.data;
  const hist = new Uint32Array(256);
  for (let q = 0; q < d.length; q += 4){
    const g = (d[q] * 0.299 + d[q + 1] * 0.587 + d[q + 2] * 0.114) | 0;
    d[q] = d[q + 1] = d[q + 2] = g; hist[g]++;
  }
  cx.putImageData(im, 0, 0);
  return hist;
}
function skStretchBin(cv){                 // contrast-stretch then otsu binarize
  const cx = cv.getContext("2d", { willReadFrequently: true });
  const im = cx.getImageData(0, 0, cv.width, cv.height), d = im.data;
  let lo = 255, hi = 0;
  for (let q = 0; q < d.length; q += 40){ const v = d[q]; if (v < lo) lo = v; if (v > hi) hi = v; }
  const span = Math.max(1, hi - lo), hist = new Uint32Array(256);
  for (let q = 0; q < d.length; q += 4){
    const v = Math.max(0, Math.min(255, Math.round((d[q] - lo) * 255 / span)));
    d[q] = d[q + 1] = d[q + 2] = v; hist[v]++;
  }
  const lvl = otsu(hist, cv.width * cv.height);
  for (let q = 0; q < d.length; q += 4){
    const v = d[q] < lvl ? 0 : 255; d[q] = d[q + 1] = d[q + 2] = v;
  }
  cx.putImageData(im, 0, 0);
  return cv;
}
function skBin(cv){
  const hist = skGrey(cv);
  const cx = cv.getContext("2d", { willReadFrequently: true });
  const im = cx.getImageData(0, 0, cv.width, cv.height), d = im.data;
  const lvl = otsu(hist, cv.width * cv.height);
  for (let q = 0; q < d.length; q += 4){
    const v = d[q] < lvl ? 0 : 255; d[q] = d[q + 1] = d[q + 2] = v;
  }
  cx.putImageData(im, 0, 0);
  return cv;
}
// Find the bright label rectangle in the photo (largest near-white blob on a
// small proxy) and crop to it; falls back to the full frame.
function skInkCrop(src){
  const proxy = skScale(src, 256);
  skGrey(proxy);
  const cx = proxy.getContext("2d", { willReadFrequently: true });
  const im = cx.getImageData(0, 0, proxy.width, proxy.height), d = im.data;
  const W = proxy.width, H = proxy.height;
  let lo = 255, hi = 0;
  for (let q = 0; q < d.length; q += 16){ const v = d[q]; if (v < lo) lo = v; if (v > hi) hi = v; }
  const span = Math.max(1, hi - lo);
  const bright = y => x => Math.round((d[(y * W + x) * 4] - lo) * 255 / span) >= 235;
  const at = (x, y) => Math.round((d[(y * W + x) * 4] - lo) * 255 / span) >= 235;
  const seen = new Uint8Array(W * H);
  let best = null;
  for (let y0 = 0; y0 < H; y0 += 4) for (let x0 = 0; x0 < W; x0 += 4){
    if (seen[y0 * W + x0] || !at(x0, y0)) continue;
    const stack = [[x0, y0]]; seen[y0 * W + x0] = 1;
    let n = 0, minx = x0, maxx = x0, miny = y0, maxy = y0;
    while (stack.length){
      const [x, y] = stack.pop(); n++;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1],[2,0],[-2,0],[0,2],[0,-2]]){
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < W && ny >= 0 && ny < H && !seen[ny * W + nx] && at(nx, ny)){
          seen[ny * W + nx] = 1; stack.push([nx, ny]);
        }
      }
    }
    if (!best || n > best.n) best = { n, minx, maxx, miny, maxy };
  }
  if (!best || best.n < W * H * 0.03) return src;
  const sx = src.width / W, sy = src.height / H, pad = 0.06;
  const bw = best.maxx - best.minx, bh = best.maxy - best.miny;
  const x0 = Math.max(0, Math.round((best.minx - bw * pad) * sx));
  const x1 = Math.min(src.width, Math.round((best.maxx + bw * pad) * sx));
  const y0 = Math.max(0, Math.round((best.miny - bh * pad) * sy));
  const y1 = Math.min(src.height, Math.round((best.maxy + bh * pad) * sy));
  if (x1 - x0 < src.width * 0.08 || y1 - y0 < src.height * 0.08) return src;
  const out = document.createElement("canvas");
  out.width = x1 - x0; out.height = y1 - y0;
  out.getContext("2d").drawImage(src, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}
// OCR splits big numbers into fragments and scatters them across its own line
// structure — merge digit words geometrically: same visual row, adjacent.
function skMerge(words){
  const ws = words.map(w => ({
    d: toEn(String(w.text || "")).replace(/[^\d]/g, ""),
    x0: w.bbox ? w.bbox.x0 : 0, x1: w.bbox ? w.bbox.x1 : 0,
    yc: w.bbox ? (w.bbox.y0 + w.bbox.y1) / 2 : 0,
    h: w.bbox ? (w.bbox.y1 - w.bbox.y0) : 0
  })).filter(w => w.d).sort((a, b) => a.yc - b.yc || a.x0 - b.x0);
  const rows = [];
  ws.forEach(w => {
    const R = rows.find(r => Math.abs(r.yc - w.yc) < Math.max(r.h, w.h) * 0.7);
    if (R){ R.items.push(w); R.yc = (R.yc + w.yc) / 2; R.h = Math.max(R.h, w.h); }
    else rows.push({ yc: w.yc, h: w.h, items: [w] });
  });
  const toks = [];
  rows.forEach(R => {
    let cur = null;
    R.items.sort((a, b) => a.x0 - b.x0).forEach(w => {
      if (cur && w.x0 - cur.x1 < Math.max(cur.h, w.h) * 1.6){
        cur.d += w.d; cur.x1 = w.x1; cur.h = Math.max(cur.h, w.h);
      } else { if (cur) toks.push(cur); cur = { ...w, yc: R.yc }; }
    });
    if (cur) toks.push(cur);
  });
  return toks;
}
// waybill wins outright; else the tallest valid code in the LOWER half is a
// strong vote (barcode garbage lives up top), anything else a weak one.
function skAnalyse(words, imgH, valid, cyc){
  const toks = skMerge(words);
  const hs = toks.map(t => t.h).sort((a, b) => a - b);
  const med = hs.length ? hs[hs.length >> 1] : 0;
  const cands = [];
  for (const t of toks){
    const d = t.d;
    if (cyc && d.length === 8 && d.startsWith(cyc)){
      const n = parseInt(d.slice(4), 10);
      if (valid.has(n)) return { wb: n };
    }
    if (/^\d{1,4}$/.test(d)){
      const n = parseInt(d, 10);
      if (!valid.has(n)) continue;
      if (med && t.h > med * 2.8) continue;
      cands.push({ n, h: t.h, low: t.yc > imgH * 0.5 });
    }
  }
  const tallest = (pool, margin) => {
    const byN = {};
    pool.forEach(c => byN[c.n] = Math.max(byN[c.n] || 0, c.h));
    const r = Object.entries(byN).map(([n, h]) => ({ n: +n, h })).sort((a, b) => b.h - a.h);
    if (r.length === 1) return r[0].n;
    if (r.length > 1 && r[0].h >= r[1].h * margin) return r[0].n;
    return null;
  };
  const low = cands.filter(c => c.low);
  return { strong: low.length ? tallest(low, 1.30) : null, weak: cands.length ? tallest(cands, 1.20) : null };
}

async function runShkoScan(e){
  const files = [...e.target.files];
  e.target.value = "";
  if (!files.length) return;
  const cyc = $("sk-cycle").value;
  if (!cyc) return;

  if (sk2Url){ URL.revokeObjectURL(sk2Url); sk2Url = null; }
  sk2Rows = []; sk2Fails = []; sk2Idx = 0;
  if (sk2Url){ URL.revokeObjectURL(sk2Url); sk2Url = null; }
  $("sk2-results").innerHTML = ""; $("sk2-review").innerHTML = "";
  $("sk2-review").classList.add("hide"); $("sk2-apply").classList.add("hide");
  $("sk2-progress").classList.remove("hide");

  await freshSession();
  const { data: os } = await db.from("orders")
    .select("id,seq,balance_iqd,status,customers(instagram_username)").eq("cycle_code", cyc);
  sk2Orders = {};
  (os || []).forEach(o => sk2Orders[Number(o.seq)] = o);
  const valid = new Set(Object.keys(sk2Orders).map(Number));

  // Our labels carry a Code 128 barcode of cycle+code. The browser's native
  // detector reads it in milliseconds at any angle — OCR is only the fallback
  // for damaged prints or browsers without the API (iOS Safari).
  let detector = null;
  try {
    if ("BarcodeDetector" in window){
      const fs = await BarcodeDetector.getSupportedFormats();
      if (fs.includes("code_128")) detector = new BarcodeDetector({ formats: ["code_128"] });
    }
  } catch (e){}

  let worker = null, workerDead = false;
  const getWorker = async () => {
    if (workerDead) throw new Error("ocr-unavailable");
    if (!worker){
      try {
        worker = await Tesseract.createWorker("eng");
        await worker.setParameters({ tessedit_char_whitelist: "0123456789-,./ " });
      } catch (e){
        workerDead = true;
        say("sk-msg", "OCR: " + e.message, "err", 0);
        throw e;
      }
    }
    return worker;
  };
  let psmNow = null;

  for (let i = 0; i < files.length; i++){
    $("sk2-bar").style.width = `${(i / files.length) * 100}%`;
    $("sk2-count").textContent = `${t().reading} ${i + 1} / ${files.length}`;
    try {
      const bmp = await loadOriented(files[i]);
      let hit = null, guess = null;
      if (detector){
        try {
          for (const c of await detector.detect(bmp)){
            const v = String(c.rawValue || "").replace(/\D/g, "");
            if (v.length === 8 && v.startsWith(cyc)){
              const n = parseInt(v.slice(4), 10);
              if (valid.has(n)){ hit = n; break; }
            }
          }
        } catch (e){}
      }
      if (hit == null){
        const w = await getWorker();
        // the bench winner: crop hi-res sparse first, then full-frame block,
        // crop block, full sparse, stretched-binarized crop sparse
        const full = skScale(bmp, 2600); skGrey(full);
        const fb = skBin(skScale(bmp, 2600));
        const crop = skInkCrop(bmp);
        const hi = skScale(crop, 2400); skGrey(hi);
        const nhib = skStretchBin(skScale(crop, 2400));
        const plans = [[hi, "11"], [fb, "6"], [hi, "6"], [fb, "11"], [nhib, "11"]];
        const strongs = [], weaks = [];
        for (const [cv, psm] of plans){
          if (psm !== psmNow){ await w.setParameters({ tessedit_pageseg_mode: psm }); psmNow = psm; }
          const { data } = await w.recognize(cv);
          const r = skAnalyse(data.words || [], cv.height, valid, cyc);
          if (r.wb != null){ hit = r.wb; break; }
          if (r.strong != null){
            strongs.push(r.strong);
            if (strongs.filter(x => x === r.strong).length >= 2){ hit = r.strong; break; }
          }
          if (r.weak != null) weaks.push(r.weak);
        }
        if (hit == null){
          // photo taken sideways or upside down: one full binarized pass each
          for (const deg of [180, 90, 270]){
            const rb = skBin(skScale(rotSrc(bmp, deg, 2600), 2600));
            if (psmNow !== "11"){ await w.setParameters({ tessedit_pageseg_mode: "11" }); psmNow = "11"; }
            const { data } = await w.recognize(rb);
            const r = skAnalyse(data.words || [], rb.height, valid, cyc);
            if (r.wb != null){ hit = r.wb; break; }
            if (r.strong != null){ hit = r.strong; break; }
          }
        }
        if (hit == null && strongs.length){
          const cnt = {}; strongs.forEach(x => cnt[x] = (cnt[x] || 0) + 1);
          hit = +Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
        }
        if (hit == null && weaks.length){
          const cnt = {}; weaks.forEach(x => cnt[x] = (cnt[x] || 0) + 1);
          const [n, c] = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
          if (c >= 2) hit = +n; else guess = +n;
        }
      }
      if (hit != null && !sk2Rows.some(r => r.seq === hit))
        sk2Rows.push({ seq: hit, file: files[i] });
      else if (hit != null)
        // two photos read as the same code: one of them is likely misread,
        // so this one goes to manual review instead of being dropped
        sk2Fails.push({ file: files[i], guess: hit, why: "dup" });
      else sk2Fails.push({ file: files[i], guess, why: "no-code" });
      if (bmp.close) bmp.close();
    } catch (err){
      console.error("shko scan", files[i].name, err);
      sk2Fails.push({ file: files[i], guess: null, why: err.message || String(err) });
    }
  }
  if (worker) await worker.terminate();
  $("sk2-bar").style.width = "100%";
  $("sk2-progress").classList.add("hide");
  if (!sk2Rows.length && sk2Fails.length){
    const whys = {};
    sk2Fails.forEach(f => whys[f.why || "?"] = (whys[f.why || "?"] || 0) + 1);
    say("sk2-count" && "sk-msg",
      Object.entries(whys).map(([w, n]) => `${n} × ${w}`).join(" · "), "err", 0);
  }
  renderShkoScan();
}

function renderShkoScan(){
  const rows = sk2Rows.map(r => {
    const o = sk2Orders[r.seq];
    return `<div class="row" style="cursor:default">
      <div class="l"><div class="c num">${$("sk-cycle").value}-${String(r.seq).padStart(4,"0")}</div>
        <div class="u" dir="ltr">${o?.customers?.instagram_username || "—"}</div></div>
      <div class="b num" style="color:var(--teal)">${iqd(o?.balance_iqd || 0)}</div>
    </div>`;
  }).join("");
  $("sk2-results").innerHTML =
    `<div class="sbar" style="margin-bottom:14px">
       <button class="on">${t().scFound}<b>${sk2Rows.length}</b></button>
       ${sk2Fails.length ? `<button>${t().scFailed}<b>${sk2Fails.length}</b></button>` : ""}
     </div>` + rows;
  renderShkoReview();
  $("sk2-apply").classList.toggle("hide", !sk2Rows.length);
}

function renderShkoReview(){
  const box = $("sk2-review");
  if (sk2Url){ URL.revokeObjectURL(sk2Url); sk2Url = null; }
  if (!sk2Fails.length){ box.classList.add("hide"); box.innerHTML = ""; return; }
  box.classList.remove("hide");
  if (sk2Idx >= sk2Fails.length) sk2Idx = 0;   // skipped items cycle back
  const item = sk2Fails[sk2Idx];
  sk2Url = URL.createObjectURL(item.file);
  box.innerHTML = `
    <div style="background:rgba(226,75,74,.06);border:1px solid rgba(226,75,74,.28);
      border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="color:#F09595;font-size:13px">${t().revTitle}</span>
        <span class="num" style="color:var(--mute);font-size:12px">${sk2Idx + 1} ${t().revOf} ${sk2Fails.length}</span>
      </div>
      <img src="${sk2Url}" alt="" style="width:100%;max-height:340px;object-fit:contain;
        background:#000;border-radius:8px;margin-bottom:12px">
      ${item.why === "dup" ? `<div style="color:#EFC368;font-size:12.5px;line-height:1.8;margin-bottom:8px">
        ${t().revDupHint} <b class="num" dir="ltr">${$("sk-cycle").value}-${String(item.guess).padStart(4,"0")}</b>
        <span dir="ltr">${sk2Orders[item.guess]?.customers?.instagram_username || ""}</span><br>
        ${t().revDupDrop}</div>` : ""}
      ${item.why === "swapped" ? `<div style="color:#EFC368;font-size:12.5px;line-height:1.8;margin-bottom:8px">
        ${t().revSwapHint}</div>` : ""}
      <div class="f" style="margin-bottom:8px"><label>${t().revSeq}</label>
        <input id="sk2-rv" dir="ltr" inputmode="numeric" autocomplete="off" value="${item.why === "dup" ? "" : item.guess ?? ""}"></div>
      <div id="sk2-rv-err" style="color:#F09595;font-size:12px;min-height:16px;margin-bottom:8px"></div>
      <div style="display:flex;gap:10px">
        <button class="btn" id="sk2-rv-save" style="margin:0;flex:2">${t().revSave}</button>
        <button class="btn" id="sk2-rv-skip" style="margin:0;flex:1;background:transparent;
          border:1px solid var(--line);color:var(--mute)">${t().revSkip}</button>
        <button class="btn" id="sk2-rv-drop" style="margin:0;flex:1;background:transparent;
          border:1px solid rgba(226,75,74,.4);color:#F09595">${t().revDrop}</button>
      </div>
    </div>`;
  const inp = $("sk2-rv");
  const save = () => {
    const n = parseInt(toEn(inp.value).replace(/[^\d]/g, ""), 10);
    if (!n || !sk2Orders[n]){ $("sk2-rv-err").textContent = t().scNoOrder; inp.focus(); return; }
    const taken = sk2Rows.find(r => r.seq === n);
    if (taken){
      // the user just confirmed THIS photo shows code n, so it takes the row;
      // the photo that auto-claimed it comes back for review
      sk2Fails.push({ file: taken.file, guess: null, why: "swapped" });
      taken.file = sk2Fails[sk2Idx].file;
    } else sk2Rows.push({ seq: n, file: sk2Fails[sk2Idx].file });
    sk2Fails.splice(sk2Idx, 1);
    renderShkoScan();
  };
  $("sk2-rv-save").addEventListener("click", save);
  $("sk2-rv-skip").addEventListener("click", () => { sk2Idx++; renderShkoReview(); });
  $("sk2-rv-drop").addEventListener("click", () => { sk2Fails.splice(sk2Idx, 1); renderShkoScan(); });
  inp.addEventListener("keydown", ev => { if (ev.key === "Enter"){ ev.preventDefault(); save(); } });
  inp.focus();
}

async function applyShkoScan(){
  if (!sk2Rows.length) return;
  const cyc = $("sk-cycle").value;
  if (!confirm(`${sk2Rows.length}?`)) return;
  const b = $("sk2-apply"); b.disabled = true; b.innerHTML = '<span class="spin"></span>';

  const rows = sk2Rows.map(r => {
    const o = sk2Orders[r.seq];
    return { order_id: o.id, cycle_code: cyc, seq: r.seq,
      username: o.customers?.instagram_username || null, amount_iqd: o.balance_iqd || 0 };
  });
  const { error } = await db.from("shipments").upsert(rows, { onConflict: "order_id", ignoreDuplicates: true });
  if (error){ b.disabled = false; b.textContent = t().shkoApply; return say("sk-msg", error.message, "err"); }

  // attach each photo to its shipment
  const ids = rows.map(r => r.order_id);
  const { data: sh } = await db.from("shipments").select("id,order_id,seq").in("order_id", ids);
  const byOrder = {}; (sh || []).forEach(x => byOrder[x.order_id] = x);
  let attached = 0;
  for (const r of sk2Rows){
    const o = sk2Orders[r.seq], srec = o && byOrder[o.id];
    if (!srec) continue;
    const path = `${cyc}/${r.seq}-${srec.id}.jpg`;
    const { error: ue } = await db.storage.from("labels")
      .upload(path, r.file, { upsert: true, contentType: r.file.type || "image/jpeg" });
    if (!ue){ await db.from("shipments").update({ image_path: path }).eq("id", srec.id); attached++; }
  }
  const moved = await markOutForDelivery(rows.map(r => r.order_id));
  b.disabled = false; b.textContent = t().shkoApply;
  say("sk-msg", `${rows.length} ✓ · 🖼 ${attached}` +
    (moved ? ` · ${t().shkoMoved}: ${moved}` : ""), "ok", 0);
  if (sk2Url){ URL.revokeObjectURL(sk2Url); sk2Url = null; }
  sk2Rows = []; sk2Fails = []; sk2Idx = 0;
  $("sk2-results").innerHTML = ""; $("sk2-review").innerHTML = "";
  $("sk2-review").classList.add("hide"); $("sk2-apply").classList.add("hide");
  loadShko();
}

async function addShko(seqs){
  const cyc = $("sk-cycle").value;
  if (!seqs.length || !cyc) return;
  const { data: os, error } = await db.from("orders")
    .select("id,seq,balance_iqd,customers(instagram_username)")
    .eq("cycle_code", cyc).in("seq", seqs);
  if (error) return say("sk-msg", error.message, "err");
  const found = new Set((os || []).map(o => Number(o.seq)));
  const rows = (os || []).map(o => ({ order_id: o.id, cycle_code: cyc, seq: o.seq,
    username: o.customers?.instagram_username || null, amount_iqd: o.balance_iqd || 0 }));
  if (rows.length){
    const { error: ie } = await db.from("shipments")
      .upsert(rows, { onConflict: "order_id", ignoreDuplicates: true });
    if (ie) return say("sk-msg", ie.message, "err");
  }
  const missing = seqs.filter(q => !found.has(q));
  const moved = await markOutForDelivery(rows.map(r => r.order_id));
  say("sk-msg", `${rows.length} ✓` +
    (moved ? ` · ${t().shkoMoved}: ${moved}` : "") +
    (missing.length ? ` · ${t().scNoOrder}: ${missing.join(" ")}` : ""), "ok", 0);
  $("sk-codes").value = "";
  loadShko();
}

async function addAllOfd(){
  const cyc = $("sk-cycle").value;
  if (!cyc) return;
  const { data: os, error } = await db.from("orders")
    .select("id,seq,balance_iqd,customers(instagram_username)")
    .eq("cycle_code", cyc).eq("status", "out_for_delivery");
  if (error) return say("sk-msg", error.message, "err");
  if (!(os || []).length) return say("sk-msg", t().shkoNone, "err");
  const rows = os.map(o => ({ order_id: o.id, cycle_code: cyc, seq: o.seq,
    username: o.customers?.instagram_username || null, amount_iqd: o.balance_iqd || 0 }));
  const { error: ie } = await db.from("shipments")
    .upsert(rows, { onConflict: "order_id", ignoreDuplicates: true });
  if (ie) return say("sk-msg", ie.message, "err");
  say("sk-msg", `${rows.length} ✓`, "ok");
  loadShko();
}

// Who is on the site right now: each signed-in session joins a realtime
// presence channel; closing the tab drops them off within a minute.
let presenceCh = null;
function startPresence(session){
  if (presenceCh || !me) return;
  presenceCh = db.channel("online-staff", { config: { presence: { key: session.user.id } } });
  presenceCh.on("presence", { event: "sync" }, paintOnline);
  presenceCh.subscribe(async st => {
    if (st === "SUBSCRIBED")
      await presenceCh.track({ name: me.full_name, role: me.role });
  });
}
function paintOnline(){
  if (!presenceCh) return;
  const state = presenceCh.presenceState();
  const users = Object.values(state).map(a => a[0]).filter(Boolean);
  $("h-online").innerHTML = users.map(u =>
    `<span style="display:inline-flex;align-items:center;gap:6px;background:var(--deep);
       border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px">
       <span style="width:8px;height:8px;border-radius:50%;background:#1D9E75;
         box-shadow:0 0 6px rgba(29,158,117,.8)"></span>${u.name}${u.role === "admin" ? " ★" : ""}</span>`).join("");
}

db.auth.onAuthStateChange(async (_e, session) => {
  if (!session){
    started = false;
    $("login").classList.remove("hide");
    $("app").classList.add("hide");
    return;
  }
  // Supabase fires this again on token refresh and tab focus.
  // Only set the app up the first time, or we bounce back to home mid-task.
  if (started) return;
  started = true;

  const { data: s } = await db.from("staff").select("full_name,role").eq("id", session.user.id).maybeSingle();
  if (!s){
    started = false;
    say("lg-msg", "No staff record for this account.", "err");
    await db.auth.signOut();
    return;
  }
  me = s;
  const { error: ce } = await db.from("orders").select("collected_iqd").limit(1);
  hasCollect = !ce;
  const { error: se2 } = await db.from("shipments").select("id").limit(1);
  hasShip = !se2;
  const { error: ce2 } = await db.from("expenses").select("id").limit(1);
  hasCosts = !ce2;
  $("me").textContent = s.full_name;
  $("login").classList.add("hide");
  $("app").classList.remove("hide");
  paintLang();
  startPresence(session);
  await loadHome();
  view("home");
});

paintLang();
</script>

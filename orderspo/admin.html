<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheinspo — بەڕێوەبردن</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#172B31">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Noto+Kufi+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#172B31;--deep:#0F1F24;--line:#2C4249;--teal:#2AADA5;--teal-d:#248782;
 --white:#FFF;--mute:#8FA3A8;--faint:#5C7178;--red:#E24B4A;--r:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--white);font-family:"Noto Kufi Arabic",system-ui,sans-serif;
 min-height:100dvh;font-size:15px}
.num{font-family:"Archivo",sans-serif;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.hide{display:none!important}
.dtable{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);border-radius:12px;background:var(--deep)}
.dtable table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px;
  direction:ltr}
.dtable th{background:#132329;color:var(--mute);font-weight:500;font-size:11.5px;
  padding:11px 14px;text-align:left;white-space:nowrap;cursor:pointer;
  position:sticky;top:0;border-bottom:1px solid var(--line)}
.dtable th:hover{color:var(--teal)}
.dtable td{padding:11px 14px;border-bottom:1px solid rgba(44,66,73,.5);
  text-align:left;white-space:nowrap}
.dtable td.money,.dtable th.money{text-align:right}
.dtable tr:last-child td{border-bottom:0}
.dtable tbody tr{cursor:pointer}
.dtable tbody tr:hover{background:rgba(42,173,165,.06)}
.dtable .code{color:var(--teal);font-weight:500}
.dtable .bal{font-weight:600}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;
  background:rgba(42,173,165,.14);color:var(--teal);white-space:nowrap}
.chip.grey{background:rgba(143,163,168,.14);color:var(--mute)}
.sbar{display:flex;flex-wrap:wrap;gap:8px}
.sbar button{background:var(--deep);border:1px solid var(--line);color:var(--mute);
  border-radius:20px;padding:7px 14px;font:400 12.5px inherit;cursor:pointer}
.sbar button.on{border-color:var(--teal);color:var(--teal)}
.sbar button b{color:var(--white);margin-inline-start:5px}


header{position:sticky;top:0;background:var(--ink);border-bottom:1px solid var(--line);
 padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:20}
header .who{flex:1;font-size:13px;color:var(--mute)}
header .who b{color:var(--white);font-weight:500}
header button{background:none;border:0;color:var(--faint);font:500 12px inherit;padding:6px 8px;cursor:pointer}
header button.on{color:var(--teal)}

main{padding:16px 16px 90px;max-width:520px;margin:0 auto}
main:has(#v-dash:not(.hide)){max-width:1500px}
h2{font-size:17px;font-weight:500;margin-bottom:14px}
label{display:block;color:var(--mute);font-size:12px;margin-bottom:6px}
.f{margin-bottom:14px}
input,select,textarea{width:100%;min-height:48px;background:var(--deep);border:1px solid var(--line);
 border-radius:var(--r);color:var(--white);font:400 16px "Archivo",sans-serif;padding:12px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
select{font-family:"Noto Kufi Arabic",sans-serif}
textarea{min-height:72px;font-family:"Noto Kufi Arabic",sans-serif;resize:vertical}
.btn{width:100%;min-height:50px;background:var(--teal);border:0;border-radius:var(--r);
 color:#06282B;font:600 15px inherit;cursor:pointer;margin-top:4px}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--white)}
.btn.warn{background:transparent;border:1px solid var(--red);color:#F09595}
.msg{border-radius:var(--r);padding:12px 14px;font-size:13px;line-height:1.7;margin-bottom:14px}
.msg.err{background:rgba(226,75,74,.12);border:1px solid rgba(226,75,74,.4);color:#F09595}
.msg.ok{background:rgba(42,173,165,.12);border:1px solid rgba(42,173,165,.4);color:var(--teal)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.tile{background:var(--deep);border-radius:12px;padding:13px}
.tile .k{color:var(--mute);font-size:11.5px;margin-bottom:5px}
.tile .v{font-size:19px;font-weight:600}
.tile.wide{grid-column:1/-1}
.tile.wide .v{color:var(--teal);font-size:22px}
.tile .sub{color:var(--mute);font-size:11px;font-weight:400;margin-top:5px}
.skimg{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--deep);font-size:15px;flex:0 0 auto}

.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.nav button{background:var(--deep);border:1px solid var(--line);border-radius:12px;
 padding:16px 12px;color:var(--white);font:500 14px inherit;cursor:pointer;min-height:62px}

.row{display:flex;align-items:center;gap:12px;background:var(--deep);border-radius:12px;
 padding:13px 14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.row:active{border-color:var(--teal)}
.row .l{flex:1;min-width:0}
.row .c{color:var(--teal);font-size:13px}
.row .u{font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:11.5px;color:var(--faint);margin-top:3px}
.row .b{text-align:left;font-size:15px;font-weight:600;flex-shrink:0}

.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--mute)}

.pill{display:inline-block;background:rgba(42,173,165,.15);color:var(--teal);
 border-radius:20px;padding:5px 13px;font-size:12.5px;margin-bottom:14px}
.steps{margin:6px 0 18px}
.st{display:flex;gap:12px;align-items:flex-start}
.st .g{display:flex;flex-direction:column;align-items:center;width:14px;flex-shrink:0}
.st .dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--line);margin-top:5px}
.st.done .dot{background:var(--teal);border-color:var(--teal)}
.st.now .dot{width:14px;height:14px;background:var(--teal);border-color:var(--teal);margin-top:3px}
.st .ln{width:1px;flex:1;min-height:15px;background:var(--line)}
.st.done .ln{background:var(--teal-d)}
.st:last-child .ln{display:none}
.st .tx{font-size:13px;color:var(--faint);padding-bottom:14px}
.st.done .tx{color:#C9D6D9}
.st.now .tx{color:var(--white);font-weight:500}
.st .dt{font-size:11px;color:var(--faint);margin-top:2px}

.count{background:var(--deep);border-radius:12px;padding:15px;text-align:center;margin-bottom:16px}
.count .n{font-size:30px;font-weight:600;color:var(--teal)}
.count .t{color:var(--mute);font-size:12.5px;margin-top:5px;line-height:1.7}
.back{background:none;border:0;color:var(--teal);font:500 14px inherit;padding:0 0 14px;cursor:pointer}
.empty{color:var(--faint);font-size:13.5px;text-align:center;padding:30px 10px;line-height:1.8}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(6,40,43,.3);
 border-top-color:#06282B;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="login">
  <main style="padding-top:70px">
    <div style="text-align:center;margin-bottom:34px">
      <div style="font:600 21px 'Archivo';letter-spacing:1.5px">SHEINSPO</div>
      <div style="width:30px;height:2px;background:var(--teal);margin:11px auto 0"></div>
    </div>
    <div id="lg-msg"></div>
    <div class="f"><label>ئیمەیل</label><input id="lg-email" type="email" autocomplete="username" dir="ltr"></div>
    <div class="f"><label>وشەی نهێنی</label><input id="lg-pass" type="password" autocomplete="current-password" dir="ltr"></div>
    <button class="btn" id="lg-go">چوونەژوورەوە</button>
  </main>
</div>

<div id="app" class="hide">
  <header>
    <span class="who">بەخێربێیت <b id="me"></b> <span style="color:#3E545B;font-size:10px">v86</span></span>
    <button id="l-ku" class="on">KU</button>
    <button id="l-ar">AR</button>
    <button id="out">دەرچوون</button>
  </header>
  <main>
    <div id="v-home">
      <div id="h-online" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>
      <div id="h-alerts" style="margin-bottom:6px"></div>
      <div class="tiles">
        <div class="tile"><div class="k" data-t="cycle"></div><div class="v num" id="h-cycle">—</div></div>
        <div class="tile"><div class="k" data-t="orders"></div><div class="v num" id="h-count">—</div></div>
      </div>
      <div class="tiles hide" id="h-money">
        <div class="tile"><div class="k" data-t="billed"></div><div class="v num" id="h-billed">—</div></div>
        <div class="tile"><div class="k" data-t="paidUp"></div><div class="v num" id="h-paid">—</div></div>
        <div class="tile"><div class="k" data-t="cod"></div><div class="v num" id="h-cash" style="color:var(--teal)">—</div></div>
        <div class="tile"><div class="k" data-t="codPending"></div><div class="v num" id="h-pending" style="color:var(--teal)">—</div></div>
      </div>
      <div class="nav">
        <button data-go="new" data-t="newOrder"></button>
        <button data-go="paste" data-t="pasteMany"></button>
        <button data-go="dash" data-t="dashboard" id="nav-dash" class="hide"></button>
        <button data-go="scan" data-t="scanBags" id="nav-scan" class="hide"></button>
        <button data-go="shko" data-t="shkoTitle" id="nav-shko" class="hide"></button>
        <button data-go="cost" data-t="costTitle" id="nav-cost" class="hide"></button>
        <button data-go="lbl" data-t="lblTitle"></button>
        <button data-go="batch" data-t="moveBatch"></button>
        <button data-go="home" data-t="refresh"></button>
      </div>
      <div class="f"><label data-t="searchLbl"></label><input id="q" placeholder="312"></div>
      <button class="btn ghost" id="q-go" data-t="search"></button>
      <div id="results" style="margin-top:16px"></div>
    </div>

    <div id="v-new" class="hide">
      <button class="back" data-go="home" data-t="back"></button>
      <h2 data-t="newOrder"></h2>
      <div id="n-msg"></div>
      <div class="f"><label data-t="username"></label><input id="n-user" dir="ltr" autocomplete="off"></div>
      <div class="f"><label data-t="phone"></label><input id="n-phone" inputmode="tel" dir="ltr" placeholder="7501234567"></div>
      <div class="f"><label data-t="address"></label><textarea id="n-addr"></textarea></div>
      <div class="f"><label data-t="total"></label><input id="n-total" inputmode="numeric" dir="ltr"></div>
      <div class="f"><label data-t="deposit"></label><input id="n-dep" inputmode="numeric" dir="ltr" value="0"></div>
      <div class="f"><label data-t="items"></label><input id="n-items" inputmode="numeric" dir="ltr"></div>
      <button class="btn" id="n-go" data-t="save"></button>
    </div>

    <div id="v-detail" class="hide">
      <button class="back" data-go="home" data-t="back"></button>
      <div id="d-msg"></div>
      <div class="pill num" id="d-code"></div>
      <h2 id="d-user"></h2>
      <div style="margin-bottom:18px">
        <div class="kv"><span data-t="total"></span><span class="num" id="d-total"></span></div>
        <div class="kv"><span data-t="deposit"></span><span class="num" id="d-dep"></span></div>
        <div class="kv"><span data-t="due"></span><span class="num" id="d-due" style="color:var(--teal);font-weight:600"></span></div>
        <div class="kv hide" id="d-coll-row"><span data-t="collected"></span><span class="num" id="d-coll" style="font-weight:600"></span></div>
        <div class="kv"><span data-t="phone"></span><span class="num" id="d-phone"></span></div>
        <div class="kv"><span data-t="address"></span><span id="d-addr" style="text-align:left;max-width:60%"></span></div>
      </div>
      <div id="d-bags" style="margin-bottom:18px"></div>
      <div class="steps" id="d-steps"></div>
      <div class="f"><label data-t="setStatus"></label><select id="d-status"></select></div>
      <div class="f hide" id="d-collect-box"><label data-t="collected"></label>
        <input id="d-collect" inputmode="numeric" dir="ltr"></div>
      <button class="btn" id="d-go" data-t="update"></button>
      <div style="margin-top:24px;padding-top:18px;border-top:1px solid var(--line)">
        <div class="f"><label data-t="username"></label><input id="d-c-user" dir="ltr"></div>
        <div class="f"><label data-t="phone"></label><input id="d-c-phone" inputmode="tel" dir="ltr"></div>
        <div class="f"><label data-t="address"></label><textarea id="d-c-addr"></textarea></div>
        <button class="btn ghost" id="d-c-save" data-t="saveCustomer"></button>
      </div>
      <div style="margin-top:24px;padding-top:18px;border-top:1px solid var(--line)">
        <div style="display:flex;gap:10px">
          <div class="f" style="flex:1"><label data-t="items"></label><input id="d-f-items" inputmode="numeric" dir="ltr"></div>
          <div class="f" style="flex:1"><label data-t="itemsCode"></label><input id="d-f-icode" dir="ltr"></div>
        </div>
        <div style="display:flex;gap:10px">
          <div class="f" style="flex:1"><label data-t="bagsCode"></label><input id="d-f-bags" dir="ltr"></div>
          <div class="f" style="flex:1"><label data-t="codeE"></label><input id="d-f-ecode" dir="ltr"></div>
        </div>
        <div style="display:flex;gap:10px">
          <div class="f" style="flex:1"><label data-t="qtyShip"></label><input id="d-f-qty" inputmode="numeric" dir="ltr"></div>
          <div class="f" style="flex:1"><label data-t="kg"></label><input id="d-f-kg" inputmode="decimal" dir="ltr"></div>
        </div>
        <div class="f"><label data-t="info"></label><textarea id="d-f-notes"></textarea></div>
        <button class="btn ghost" id="d-f-save" data-t="saveFields"></button>
      </div>
      <div id="d-admin" class="hide" style="margin-top:24px;padding-top:18px;border-top:1px solid var(--line)">
        <div class="f"><label data-t="total"></label><input id="d-e-total" inputmode="numeric" dir="ltr"></div>
        <div class="f"><label data-t="deposit"></label><input id="d-e-dep" inputmode="numeric" dir="ltr"></div>
        <button class="btn ghost" id="d-save" data-t="saveAmounts"></button>
      </div>
    </div>

    <div id="v-paste" class="hide">
      <button class="back" data-go="home" data-t="back"></button>
      <h2 data-t="pasteMany"></h2>
      <div id="p-msg"></div>
      <p style="color:var(--mute);font-size:12.5px;line-height:1.9;margin-bottom:14px" data-t="pasteHelp"></p>
      <div class="f">
        <textarea id="p-box" dir="ltr" style="min-height:190px;font-family:Archivo,monospace;font-size:13px"></textarea>
      </div>
      <div class="count"><div class="n num" id="p-n">0</div><div class="t" data-t="willAdd"></div></div>
      <div id="p-preview" style="margin-bottom:14px"></div>
      <button class="btn" id="p-go" data-t="addAll"></button>

      <div id="bag-box" class="hide" style="margin-top:30px;padding-top:22px;
        border-top:1px solid var(--line)">
        <h2 data-t="addBags"></h2>
        <div id="bg-msg"></div>
        <p style="color:var(--mute);font-size:12.5px;line-height:1.9;margin-bottom:14px"
           data-t="bagHelp"></p>
        <div class="f">
          <textarea id="bg-box" dir="ltr" style="min-height:170px;
            font-family:Archivo,monospace;font-size:13px"
            placeholder="421&#9;DDDDDD9+EEEEEE1+EEEEEE2"></textarea>
        </div>
        <div class="count"><div class="n num" id="bg-n">0</div><div class="t" data-t="bagsFound"></div></div>
        <div id="bg-preview" style="margin-bottom:14px"></div>
        <button class="btn" id="bg-go" data-t="saveBags"></button>
      </div>
    </div>

    <div id="v-dash" class="hide">
      <button class="back" data-go="home" data-t="back"></button>
      <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:18px">
        <div class="f" style="flex:1;margin:0"><label data-t="month"></label>
          <select id="dh-cycle"></select></div>
        <button class="btn ghost" id="dh-export" style="width:auto;padding:0 18px;margin:0"
          data-t="exportCsv"></button>
        <button class="btn ghost" id="dh-exp-courier" style="width:auto;padding:0 18px;margin:0"
          data-t="exportCourier"></button>
      </div>

      <div class="tiles">
        <div class="tile"><div class="k" data-t="orders"></div><div class="v num" id="dh-n">—</div></div>
        <div class="tile"><div class="k" data-t="avgOrder"></div><div class="v num" id="dh-avg">—</div></div>
        <div class="tile"><div class="k" data-t="billed"></div><div class="v num" id="dh-billed">—</div></div>
        <div class="tile"><div class="k" data-t="paidUp"></div><div class="v num" id="dh-paid">—</div></div>
        <div class="tile"><div class="k" data-t="cod"></div><div class="v num" id="dh-cod" style="color:var(--teal)">—</div></div>
        <div class="tile"><div class="k" data-t="codPending"></div><div class="v num" id="dh-cod-pending" style="color:var(--teal)">—</div><div class="sub" id="dh-cod-pending-sub"></div></div>
        <div class="tile wide hide" id="dh-debt-tile"><div class="k" data-t="delivDebt"></div><div class="v num" id="dh-debt" style="color:#F09595">—</div><div class="sub" id="dh-debt-sub"></div></div>
      </div>

      <div id="dh-status" style="margin-bottom:18px"></div>

      <div class="f"><input id="dh-q" data-ph="searchLbl" placeholder=""></div>
      <div id="dh-table"></div>
    </div>

    <div id="v-scan" class="hide">
      <button class="back" data-go="home" data-t="back"></button>
      <h2 data-t="scanBags"></h2>
      <div id="sc-msg"></div>
      <p style="color:var(--mute);font-size:12.5px;line-height:1.9;margin-bottom:14px"
         data-t="scanHelp"></p>

      <div style="display:flex;gap:10px">
        <div class="f" style="flex:1"><label data-t="month"></label>
          <select id="sc-cycle"></select></div>
        <div class="f" style="flex:1"><label data-t="setStatus"></label>
          <select id="sc-status"></select></div>
      </div>

      <div class="f">
        <input type="file" id="sc-files" accept="image/*" multiple
          style="padding:14px;min-height:auto">
      </div>

      <div id="sc-progress" class="hide" style="margin-bottom:14px">
        <div style="background:var(--deep);border-radius:10px;height:8px;overflow:hidden">
          <div id="sc-bar" style="background:var(--teal);height:100%;width:0;transition:width .2s"></div>
        </div>
        <div id="sc-count" class="num" style="color:var(--mute);font-size:12px;
          text-align:center;margin-top:8px"></div>
      </div>

      <div id="sc-results"></div>

      <div id="sc-review" class="hide"></div>

      <div id="sc-manual" class="f hide">
        <label data-t="typeMissing"></label>
        <textarea id="sc-extra" dir="ltr" style="min-height:110px;
          font-family:Archivo,monospace;font-size:13px" placeholder="WWWWWW2 482"></textarea>
      </div>

      <button class="btn hide" id="sc-apply" data-t="applyBags"></button>
    </div>

    <div id="v-shko" class="hide">
      <button class="back" data-go="home" data-t="back"></button>
      <h2 data-t="shkoTitle"></h2>
      <div id="sk-msg"></div>
      <div class="tiles">
        <div class="tile wide"><div class="k" data-t="shkoRemaining"></div><div class="v num" id="sk-remaining">—</div><div class="sub" id="sk-remaining-sub"></div></div>
        <div class="tile wide"><div class="k" data-t="shkoAllRecv"></div><div class="v num" id="sk-all">—</div></div>
      </div>
      <div class="f"><label data-t="month"></label><select id="sk-cycle"></select></div>
      <button class="btn ghost" id="sk-add-ofd" data-t="shkoAddOfd" style="margin-bottom:10px"></button>
      <div style="display:flex;gap:10px;margin-bottom:16px">
        <div class="f" style="flex:1;margin:0"><input id="sk-codes" dir="ltr" inputmode="tel" placeholder="398 401 405"></div>
        <button class="btn" id="sk-add" data-t="shkoAdd" style="width:auto;margin:0;padding:0 22px"></button>
      </div>
      <div class="f">
        <label data-t="shkoScanHelp"></label>
        <input type="file" id="sk-scan" accept="image/*" multiple style="padding:14px;min-height:auto">
      </div>
      <div id="sk2-progress" class="hide" style="margin-bottom:14px">
        <div style="background:var(--deep);border-radius:10px;height:8px;overflow:hidden">
          <div id="sk2-bar" style="background:var(--teal);height:100%;width:0;transition:width .2s"></div>
        </div>
        <div id="sk2-count" class="num" style="color:var(--mute);font-size:12px;text-align:center;margin-top:8px"></div>
      </div>

<script>
const URL_ = "https://bucrapapzgyqxfqdnyaz.supabase.co";
const KEY_ = "sb_publishable_bf3Rs0aaLbxji2WHfy9A7Q_jSw20oma";
const db = window.supabase.createClient(URL_, KEY_);

// The tab sits open for hours while orders are typed in; when the phone sleeps
// the access token can expire before supabase-js gets to refresh it, and the
// next save fails with "JWT expired". So: refresh just before every write, and
// if a write still comes back with an expired token, refresh once and retry.
async function freshSession(){
  const { data: { session } } = await db.auth.getSession();
  if (!session) return null;
  if ((session.expires_at || 0) * 1000 - Date.now() < 90_000){
    const { data, error } = await db.auth.refreshSession();
    if (error){ await db.auth.signOut(); return null; }
    return data.session;
  }
  return session;
}
const isJwtErr = e => e && /jwt|expired|401|invalid.*token/i.test(String(e.message || e.code || ""));
const rawRpc = db.rpc.bind(db);
// "TypeError: Failed to fetch" = the request never reached the server (a
// dropped connection, not a rejected save) — safe to retry after a pause.
const isNetErr = e => e && /failed to fetch|networkerror|load failed/i.test(String(e.message || ""));
const pause = ms => new Promise(r => setTimeout(r, ms));
db.rpc = async (fn, args, opts) => {
  await freshSession();
  let r = await rawRpc(fn, args, opts);
  for (let i = 0; i < 2 && r.error && isNetErr(r.error); i++){
    await pause(1500 * (i + 1));
    r = await rawRpc(fn, args, opts);
  }
  if (r.error && isJwtErr(r.error)){
    const { error } = await db.auth.refreshSession();
    if (error){ await db.auth.signOut(); return r; }
    r = await rawRpc(fn, args, opts);
  }
  return r;
};

// Arabic-Indic and Persian numerals -> 0-9.
// JavaScript's \d only matches 0-9, so without this the digits vanish.
const AR = "٠١٢٣٤٥٦٧٨٩", FA = "۰۱۲۳۴۵۶۷۸۹";
const toEn = t => String(t == null ? "" : t).replace(/[٠-٩۰-۹]/g, d => {
  const i = AR.indexOf(d);
  return i > -1 ? i : FA.indexOf(d);
});

// Convert in place as the person types, so they see what was stored.
["n-phone","n-total","n-dep","n-items","d-c-phone","d-e-total","d-e-dep",
 "d-f-items","d-f-qty","d-f-kg","b-lo","b-hi","code","last4"].forEach(id => {
  document.addEventListener("input", e => {

      const v = toEn(e.target.value);
      if (v !== e.target.value){
        const at = e.target.selectionStart;
        e.target.value = v;
        try { e.target.setSelectionRange(at, at); } catch(_){}
      }
    }
  });
});

function say(box, text, kind, ms){
  $(box).innerHTML = text ? `<div class="msg ${kind || "ok"}">${text}</div>` : "";
  // errors stay twice as long; ms=0 pins the message until the next say()
  const hold = ms !== undefined ? ms : (kind === "err" ? 10000 : 5000);
  if (text && hold) setTimeout(() => { if ($(box)) $(box).innerHTML = ""; }, hold);
}

// Orders that have sat too long in one stage, judged by the business's own
// normal timings: SHEIN->Dubai 5-7 days, Dubai->Erbil 7-14, then labels+SHKO.
async function loadAlerts(){
  const { data, error } = await db.from("stuck_orders").select("cycle_code,seq,order_code,status,since");
  if (error || !data){ $("h-alerts").innerHTML = ""; return; }
  // per-stage patience: SHEIN->Dubai runs 5-7 days, so at 7 the order should
  // already be in Dubai; Dubai->Erbil 7-14d -> flag at 20; after that it's in
  // our hands (labels + SHKO), so a week is already too long.
  const LIMITS = { received: 7, purchased: 7, at_dubai: 20, in_transit: 20,
                   at_erbil: 7, out_for_delivery: 7 };
  const days = r => r.since ? (Date.now() - new Date(r.since)) / 864e5 : 999;
  const late = data.filter(r => days(r) > (LIMITS[r.status] ?? 25))
    .sort((x, y) => days(y) - days(x));
  const byStatus = {};
  late.forEach(r => (byStatus[r.status] = byStatus[r.status] || []).push(r));
  alertGroups = byStatus;
  let h = "";
  Object.keys(byStatus).sort((a, b) => FLOW.indexOf(a) - FLOW.indexOf(b)).forEach(st => {
    const list = byStatus[st];
    const codes = list.slice(0, 12).map(r =>
      `<span class="num" dir="ltr">${r.order_code}</span>`).join("، ");
    h += `<div style="padding:10px 0;border-top:1px solid rgba(239,159,39,.22)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span style="color:#EF9F27;font-size:13px;font-weight:600">${list.length} × ${t().st[st] || st} — +${LIMITS[st] ?? 25} ${t().alDays}</span>
        <button data-fix="${st}" style="margin-inline-start:auto;flex:0 0 auto;padding:6px 12px;border-radius:9px;
          border:1px solid rgba(239,159,39,.5);background:transparent;color:#EF9F27;font-size:12px">${t().alFix} ←</button>
      </div>
      <div style="color:var(--mute);font-size:11.5px;line-height:2">${codes}${list.length > 12 ? ` +${list.length - 12}` : ""}</div>
    </div>`;
  });
  $("h-alerts").innerHTML = h ? `<div style="background:rgba(239,159,39,.08);
      border:1px solid rgba(239,159,39,.35);border-radius:14px;padding:4px 16px 6px;margin:14px 0 4px">
      <div style="color:#EF9F27;font-weight:700;font-size:13.5px;padding:12px 0 8px">⚠ ${t().alTitle}</div>${h}</div>` : "";
  $("h-alerts").querySelectorAll("[data-fix]").forEach(b =>
    b.addEventListener("click", () => alertToBatch(b.dataset.fix)));
}

// Jump from an alert group into the batch mover with everything prefilled:
// the stuck orders' cycle, status, code range, and the natural next stage.
let alertGroups = {};
async function alertToBatch(st){
  const list = alertGroups[st] || [];
  if (!list.length) return;
  const byCyc = {};
  list.forEach(r => (byCyc[r.cycle_code] = byCyc[r.cycle_code] || []).push(r.seq));
  const cyc = Object.keys(byCyc).sort((a, b) => byCyc[b].length - byCyc[a].length)[0];
  const seqs = byCyc[cyc];
  await fillCycles();
  if ([...$("b-cycle").options].some(o => o.value === cyc)) $("b-cycle").value = cyc;
  $("b-from").value = st;
  // where a stuck order realistically went next, not just the formal flow
  const next = { received: "at_dubai", purchased: "at_dubai", at_dubai: "at_erbil",
    in_transit: "at_erbil", at_erbil: "out_for_delivery", out_for_delivery: "delivered" }[st];
  if (next) $("b-to").value = next;
  $("b-lo").value = Math.min(...seqs);
  $("b-hi").value = Math.max(...seqs);
  view("batch");
  countBatch();
}

  $("nav-cost").classList.toggle("hide", me.role !== "admin" || !hasCosts);

async function search(){
  const q = $("q").value.trim();
  if (!q) return;
  let sel = db.from("orders").select("id,order_code,status,balance_iqd,customers(instagram_username)").limit(25);
  if (/^\d+$/.test(q) && q.length <= 4) sel = sel.eq("cycle_code", cycle).eq("seq", Number(q));
  else if (/^\d{7,}$/.test(q)) {
    const { data: cs } = await db.from("customers").select("id").like("phone", "%" + q.slice(-7));
    sel = sel.in("customer_id", (cs || []).map(c => c.id));
  } else {
    const { data: cs } = await db.from("customers").select("id").ilike("instagram_username", "%" + q + "%");
    sel = sel.in("customer_id", (cs || []).map(c => c.id));
  }
  const { data } = await sel.order("id", { ascending: false });
  $("results").innerHTML = (data && data.length)
    ? data.map(rowHtml).join("")
    : `<div class="empty">${t().noRes}</div>`;
  document.querySelectorAll(".row").forEach(r =>
    r.addEventListener("click", () => openOrder(r.dataset.id)));
}

  if (hasCollect && o.collected_iqd != null){
    const short = Number(o.collected_iqd) < Number(o.balance_iqd);
    $("d-coll").textContent = iqd(o.collected_iqd);
    $("d-coll").style.color = short ? "#F09595" : "var(--teal)";
  }

  if (hasCollect) $("d-collect").value = o.collected_iqd ?? "";

  $("d-f-qty").value   = o.quantity_shipping ?? "";
  $("d-f-kg").value    = o.weight_kg ?? "";
  $("d-f-notes").value = o.notes || "";
  $("d-c-user").value  = o.customers?.instagram_username || "";
  $("d-c-phone").value = o.customers?.phone || "";
  $("d-c-addr").value  = o.customers?.address || "";
  $("d-admin").classList.toggle("hide", me.role !== "admin");

  const { data: bags } = await db.from("bags")
    .select("id,code,status").eq("order_id", id).order("code");
  $("d-bags").innerHTML = (bags && bags.length)

         ${t().bagsOn} (${bags.length})</div>` +

  const { data: ev } = await db.from("order_events")
    .select("status,occurred_at").eq("order_id", id).order("occurred_at");
  const seen = {};
  (ev || []).forEach(e => { if (!seen[e.status]) seen[e.status] = e.occurred_at; });
  // The timeline shows four stops: purchased and in_transit are folded into
  // the stop before them, and out_for_delivery + delivered share the last one.
  const TL = [
    { covers:["received","purchased"],  label:() => t().st.received },
    { covers:["at_dubai","in_transit"], label:() => t().st.at_dubai },
    { covers:["at_erbil"],              label:() => t().st.at_erbil },
    { covers:["out_for_delivery"],      label:() => t().st.out_for_delivery },

function batchRange(q){
  q = q.eq("cycle_code", $("b-cycle").value || cycle).eq("status", $("b-from").value);
  const lo = parseInt(toEn($("b-lo").value), 10), hi = parseInt(toEn($("b-hi").value), 10);
  if (!isNaN(lo)) q = q.gte("seq", lo);
  if (!isNaN(hi)) q = q.lte("seq", hi);
  return q;
}
async function fillCycles(){
  const sel = $("b-cycle");
  if (sel.options.length) return;
  const { data: used } = await db.from("orders").select("cycle_code");
  const have = [...new Set((used || []).map(o => o.cycle_code))];
  if (cycle && !have.includes(cycle)) have.push(cycle);
  const { data } = await db.from("cycles")
    .select("code,label").in("code", have).order("code", { ascending: false });
  sel.innerHTML = (data || []).map(c =>
    `<option value="${c.code}">${c.label || c.code}</option>`).join("");
  sel.value = cycle;
}
async function countBatch(){
  const { count } = await batchRange(
    db.from("orders").select("*", { count:"exact", head:true }));
  $("b-n").textContent = count || 0;
  showBreakdown();
}

// What is actually sitting in the chosen month and code range, by status.
async function showBreakdown(){
  let q = db.from("orders").select("status,seq")
    .eq("cycle_code", $("b-cycle").value || cycle);
  const lo = parseInt(toEn($("b-lo").value), 10), hi = parseInt(toEn($("b-hi").value), 10);
  if (!isNaN(lo)) q = q.gte("seq", lo);
  if (!isNaN(hi)) q = q.lte("seq", hi);

  const { data } = await q;
  const tally = {};
  (data || []).forEach(o => (tally[o.status] = tally[o.status] || []).push(o.seq));

  // 1,2,3,7,8,20 -> "1-3, 7-8, 20"
  const spans = list => {
    const n = [...list].sort((a,b) => a-b), out = [];
    let a = n[0], b = n[0];
    for (let i = 1; i <= n.length; i++){
      if (n[i] === b + 1){ b = n[i]; continue; }
      out.push(a === b ? `${a}` : `${a}-${b}`);
      a = b = n[i];
    }
    return out.join(", ");
  };

  const keys = Object.keys(tally).sort((a,b) => FLOW.indexOf(a) - FLOW.indexOf(b));
  $("b-breakdown").innerHTML = keys.length
    ? keys.map(k => `<div data-pick="${k}" style="cursor:pointer;padding:11px 0;
        border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between">
          <span style="font-size:14px">${t().st[k] || k}</span>
          <span class="num" style="font-weight:600">${tally[k].length}</span></div>
        <div class="num" style="color:var(--faint);font-size:11.5px;margin-top:4px;
          direction:ltr;text-align:right">${spans(tally[k])}</div></div>`).join("")
    : "";

  document.querySelectorAll("[data-pick]").forEach(el =>
    el.addEventListener("click", () => {
      $("b-from").value = el.dataset.pick;
      countBatch();
    }));
}

// Cells can contain line breaks inside quotes, so this walks the text
// character by character rather than splitting on newlines.
function splitTsv(text){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){
        if (text[i+1] === '"'){ cur += '"'; i++; }
        else q = false;
      } else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === "\t"){ row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r"){
        if (c === "\r" && text[i+1] === "\n") i++;
        row.push(cur); rows.push(row); row = []; cur = "";
      } else cur += c;
    }
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

function parsePaste(){
  const out = [], bad = [];
  splitTsv($("p-box").value).forEach((c, i) => {
    const seq = parseInt(toEn(c[0] || "").replace(/[^\d]/g, ""), 10);
    const name = (c[1] || "").trim();

    const nums = toEn(c[2] || "").match(/\d[\d,\.]*/g) || [];
    const total = nums[0] ? parseInt(nums[0].replace(/[,\.]/g, ""), 10) : null;
    let dep = nums[1] ? parseInt(nums[1].replace(/[,\.]/g, ""), 10) : 0;
    if (dep && dep < 1000) dep = dep * 1000;

    const address = (c[3] || "").replace(/\s+/g, " ").trim();

    let phone = toEn(c[4] || "").split(/[,\/]/)[0].replace(/[^\d]/g, "");
    phone = phone.replace(/^00964/, "").replace(/^964/, "").replace(/^0+/, "");
    if (phone.length !== 10) phone = null;

    if (!seq || !name || !total){ bad.push(seq || (i + 1)); return; }
    // optional 6th column: the sheet's bag codes (XXXXX4+XXXXX5 / A1)
    const bags = (String(c[5] || "").toUpperCase().match(/[A-Z]{1,8}[0-9]{1,3}/g)) || [];
    out.push({ seq, name, phone, address, total, deposit: Math.min(dep, total), bags });
  });
  return { rows: out, bad };
}

function previewPaste(){
  const { rows, bad } = parsePaste();
  $("p-n").textContent = rows.length;
  $("p-preview").innerHTML = rows.slice(0, 3).map(r =>
    `<div class="row" style="cursor:default"><div class="l">
       <div class="c num">${cycle}-${String(r.seq).padStart(4,"0")}</div>
       <div class="u">${r.name}</div>
       <div class="s num">${r.phone || "—"} · ${iqd(r.deposit)}</div></div>
     <div class="b num">${iqd(r.total)}</div></div>`).join("")
    + (bad.length ? `<div class="msg err">${t().badRows}: ${bad.join(", ")}</div>` : "");
}

$("p-box").addEventListener("input", previewPaste);

$("p-go").addEventListener("click", async () => {
  const { rows } = parsePaste();
  if (!rows.length) return;
  if (!confirm(`${rows.length}?`)) return;
  const b = $("p-go"); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  const { data, error } = await db.rpc("bulk_add_orders",
    { p_cycle: cycle, p_rows: rows.map(({ bags, ...rest }) => rest) });
  b.disabled = false; b.textContent = t().addAll;
  if (error) return say("p-msg", error.message, "err");
  const r = data[0];
  // rows that carried a bags column register their bag list in the same paste
  const bagRows = rows.filter(x => x.bags.length)
    .map(x => ({ seq: x.seq, codes: [...new Set(x.bags)], note: null }));
  let bagNote = "";
  if (bagRows.length){
    const { data: bd, error: be } = await db.rpc("add_bags", { p_cycle: cycle, p_rows: bagRows });
    bagNote = be ? ` · 🎒 ${be.message}` : ` · 🎒 ${bd?.[0]?.bags_added ?? 0} ✓`;
  }
  say("p-msg", `${r.created} — ${r.codes}` + (r.skipped ? ` · ${r.skipped} ✕` : "") + bagNote, "ok", 0);
  $("p-box").value = ""; previewPaste(); loadHome();
});

// ---------- Dashboard ----------
let dashRows = [], dashSort = {key:"seq", dir:-1}, dashFilter = null;

async function initDash(){
  const sel = $("dh-cycle");
  if (!sel.options.length){
    // Only months that actually contain orders, plus the open one.
    const { data: used } = await db.from("orders").select("cycle_code");
    const have = [...new Set((used||[]).map(o => o.cycle_code))];
    if (cycle && !have.includes(cycle)) have.push(cycle);
    const { data } = await db.from("cycles")
      .select("code,label").in("code", have).order("code",{ascending:false});
    sel.innerHTML = (data||[]).map(c=>`<option value="${c.code}">${c.label||c.code}</option>`).join("");
    sel.value = cycle;
    sel.addEventListener("change", loadDash);
    $("dh-q").addEventListener("input", renderDash);
    $("dh-export").addEventListener("click", exportDash);
    $("dh-exp-courier").addEventListener("click", exportCourier);
  }
  loadDash();
}

async function loadDash(){
  $("dh-table").innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  const { data, error } = await db.from("orders")
    .select("id,seq,order_code,status,total_iqd,deposit_iqd,balance_iqd,items_count,bags_code,weight_kg,customers(instagram_username,phone,address)"
      + (hasCollect ? ",collected_iqd" : ""))
    .eq("cycle_code", $("dh-cycle").value)
    .order("seq", { ascending:false });
  if (error){ $("dh-table").innerHTML = `<div class="msg err">${error.message}</div>`; return; }
  dashRows = data || [];
  dashFilter = null;
  paintTotals();
  renderDash();
}

function paintTotals(){
  const live = dashRows.filter(r => r.status !== "cancelled");
  const sum = k => live.reduce((a,r)=>a+Number(r[k]||0),0);
  $("dh-n").textContent = live.length;
  $("dh-billed").textContent = iqd(sum("total_iqd"));
  $("dh-paid").textContent = iqd(sum("deposit_iqd"));
  $("dh-cod").textContent = iqd(sum("balance_iqd"));
  // Money still on the street: delivered orders are already collected, so drop them.
  const pend = live.filter(r => r.status !== "delivered");
  const pendSum = pend.reduce((a,r)=>a+Number(r.balance_iqd||0),0);
  const delivSum = sum("balance_iqd") - pendSum;
  $("dh-cod-pending").textContent = iqd(pendSum);
  $("dh-cod-pending-sub").textContent = `${pend.length} ${t().orders} · ${t().st.delivered}: ${iqd(delivSum)}`;
  // delivered orders where the recorded cash is short of the balance = real debt
  $("dh-debt-tile").classList.toggle("hide", !hasCollect);
  if (hasCollect){
    const dl = live.filter(r => r.status === "delivered");
    const short = dl.filter(r => Number(r.collected_iqd ?? 0) < Number(r.balance_iqd || 0));
    const debt = short.reduce((a, r) => a + (Number(r.balance_iqd || 0) - Number(r.collected_iqd ?? 0)), 0);
    const unrec = dl.filter(r => r.collected_iqd == null).length;
    $("dh-debt").textContent = iqd(debt);
    $("dh-debt-sub").textContent = `${short.length} ${t().orders}` + (unrec ? ` · ? ${unrec}` : "");
  }
  $("dh-avg").textContent = live.length ? iqd(Math.round(sum("total_iqd")/live.length)) : "0";

  const tally = {};
  dashRows.forEach(r => tally[r.status] = (tally[r.status]||0)+1);
  const keys = Object.keys(tally).sort((a,b)=>FLOW.indexOf(a)-FLOW.indexOf(b));
  $("dh-status").innerHTML = `<div class="sbar">` +
    `<button data-f="" class="${dashFilter?"":"on"}">${t().orders}<b>${dashRows.length}</b></button>` +
    keys.map(k=>`<button data-f="${k}" class="${dashFilter===k?"on":""}">${t().st[k]||k}<b>${tally[k]}</b></button>`).join("") +
    `</div>`;
  document.querySelectorAll("#dh-status button").forEach(b =>
    b.addEventListener("click", () => { dashFilter = b.dataset.f || null; paintTotals(); renderDash(); }));
}

function renderDash(){
  const q = toEn($("dh-q").value).trim().toLowerCase();
  let rows = dashRows;
  if (dashFilter) rows = rows.filter(r => r.status === dashFilter);
  if (q) rows = rows.filter(r =>
    String(r.seq).includes(q) ||
    (r.customers?.instagram_username||"").toLowerCase().includes(q) ||
    (r.customers?.phone||"").includes(q));

  const k = dashSort.key, dir = dashSort.dir;
  rows = [...rows].sort((a,b) => {
    const get = r => k==="user" ? (r.customers?.instagram_username||"")
                   : k==="status" ? FLOW.indexOf(r.status)
                   : Number(r[k]||0);
    const x = get(a), y = get(b);
    return (x<y?-1:x>y?1:0) * dir;
  });

  if (!rows.length){ $("dh-table").innerHTML = `<div class="empty">${t().noOrders}</div>`; return; }

  const cols = [
    ["seq", t().colCode, ""], ["user", t().colUser, ""], ["phone", t().colPhone, ""],
    ["total_iqd", t().colTotal, "money"], ["deposit_iqd", t().colDep, "money"],
    ["balance_iqd", t().colBal, "money"], ["status", t().colStatus, ""],
    ["items_count", t().colItems, "money"]
  ];

  $("dh-table").innerHTML = `<div class="dtable"><table><thead><tr>` +
    cols.map(([key,label,cls]) =>
      `<th class="${cls}" data-k="${key}">${label}${dashSort.key===key ? (dir>0?" ↑":" ↓") : ""}</th>`).join("") +
    `</tr></thead><tbody>` +
    rows.map(r => `<tr data-id="${r.id}">
      <td class="code num">${r.order_code}</td>
      <td dir="ltr">${r.customers?.instagram_username || "—"}</td>
      <td class="num">${r.customers?.phone || "—"}</td>
      <td class="num money">${iqd(r.total_iqd)}</td>
      <td class="num money">${iqd(r.deposit_iqd)}</td>
      <td class="num money bal" style="color:${r.balance_iqd>0?"var(--teal)":"var(--faint)"}">${iqd(r.balance_iqd)}</td>
      <td><span class="chip${r.status==="delivered"||r.status==="cancelled"?" grey":""}">${t().st[r.status]||r.status}</span></td>
      <td class="num money">${r.items_count ?? "—"}</td>
    </tr>`).join("") +
    `</tbody></table></div>`;

  document.querySelectorAll("#dh-table th").forEach(th =>
    th.addEventListener("click", () => {
      const key = th.dataset.k;
      dashSort = { key, dir: dashSort.key===key ? -dashSort.dir : -1 };
      renderDash();
    }));
  document.querySelectorAll("#dh-table tbody tr").forEach(tr =>
    tr.addEventListener("click", () => openOrder(tr.dataset.id)));
}

const GOV_MAP = {
  "بغداد":"بغداد","اربيل":"أربيل","أربيل":"أربيل","هولير":"أربيل","هەولێر":"أربيل",

  "kirkuk":"كركوك","السليمانية":"السليمانية","سليمانية":"السليمانية","slemani":"السليمانية",
  "sulaymaniyah":"السليمانية","دهوك":"دهوك","duhok":"دهوك","dohuk":"دهوك","zakho":"دهوك",
  "زاخو":"دهوك","صلاح الدين":"صلاح الدين","الأنبار":"الأنبار","الانبار":"الأنبار",
  "النجف":"النجف","najaf":"النجف","كربلاء":"كربلاء","karbala":"كربلاء","بابل":"بابل",
  "واسط":"واسط","ديالى":"ديالى","ذي قار":"ذي قار","الناصرية":"ذي قار","ناصرية":"ذي قار",
  "المثنى":"المثنى","السماوة":"المثنى","القادسية":"القادسية","الديوانية":"القادسية",
  "ميسان":"ميسان","العمارة":"ميسان","halabja":"حلبجة","حلبجة":"حلبجة","كفري":"السليمانية",
  "ranya":"السليمانية","soran":"أربيل","koya":"أربيل","shaqllawa":"أربيل","akre":"دهوك"
};
function govOf(addr){
  const a = String(addr || "").toLowerCase();
  for (const k in GOV_MAP)
    if (a.includes(k.toLowerCase())) return GOV_MAP[k];
  return "";
}

// One file the courier's back office can bulk-load: name, phone, city, address,
// COD (the wasl is already deducted from balance), and our order code as the
// reference. Follows the status chip filter, so e.g. tap "out for delivery"
// first to export just that batch.
function exportCourier(){
  let rows = dashRows.filter(r => r.status !== "cancelled");
  if (dashFilter) rows = rows.filter(r => r.status === dashFilter);
  const head = ["reference","customer_name","phone","city","address","cod_amount_iqd","notes"];
  const q = v => `"${String(v ?? "").replace(/"/g,'""').replace(/\s+/g," ").trim()}"`;
  const lines = [head.join(",")].concat(rows.map(r => [
    r.order_code,
    q(r.customers?.instagram_username || ""),
    `="${r.customers?.phone || ""}"`,
    q(govOf(r.customers?.address)),
    q(r.customers?.address || ""),
    r.balance_iqd || 0,
    ""
  ].join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `courier_${$("dh-cycle").value}${dashFilter ? "_" + dashFilter : ""}.csv`;
  a.click();
}

function exportDash(){

    .concat(hasCollect ? ["collected"] : []);
  const lines = [head.join(",")].concat(dashRows.map(r => [

    r.customers?.phone || "",
    r.total_iqd, r.deposit_iqd, r.balance_iqd, r.status,

  const a = document.createElement("a");

  a.click();
}


// ---------- Bag scanning ----------
// Reads GC-340 <BAGCODE>-<CUSTOMERID> from label photos, entirely in the browser.
let scanRows = [], scanFails = [], revIdx = 0, revUrl = null;

// Reading 100 photos takes minutes. A dropped session, a failed save or an
// accidental refresh used to throw all of it away and mean re-uploading the
// lot, so the finished rows live in localStorage until they are safely applied.
// The photos themselves cannot be stored, but once read they are not needed.
const SC_KEY = "spo_scan_draft";
function saveScanDraft(){
  try {
    if (!scanRows.length) return clearScanDraft();
    localStorage.setItem(SC_KEY, JSON.stringify({
      cycle: $("sc-cycle").value,
      status: $("sc-status").value,
      rows: scanRows.map(r => ({ code: r.code, seq: r.seq })),
      extra: $("sc-extra").value || ""
    }));
  } catch (e){ /* private mode / quota — not worth interrupting the scan */ }
}
function clearScanDraft(){ try { localStorage.removeItem(SC_KEY); } catch (e){} }

async function restoreScanDraft(){
  if (scanRows.length) return;               // work in progress wins over the draft
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SC_KEY) || "null"); } catch (e){}
  if (!d || !Array.isArray(d.rows) || !d.rows.length) return;
  const pick = (sel, v) => { if (v && [...sel.options].some(o => o.value === v)) sel.value = v; };
  pick($("sc-cycle"), d.cycle);
  pick($("sc-status"), d.status);
  scanRows = d.rows.map(r => ({ code: r.code, seq: r.seq }));
  scanFails = []; revIdx = 0;
  if (d.extra) $("sc-extra").value = d.extra;
  await showScan();
  say("sc-msg", `${t().scRestored}: ${scanRows.length}`, "ok");
}

// Otsu: pick the greyscale cutoff that best separates ink from paper.
// Phone photos have uneven light, so one fixed number never fits every photo.
function otsu(hist, total){
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, level = 128;
  for (let i = 0; i < 256; i++){
    wB += hist[i];
    if (!wB) continue;
    const wF = total - wB;
    if (!wF) break;
    sumB += i * hist[i];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > best){ best = between; level = i; }
  }
  return level;
}

// iPhone photos are stored sideways with an EXIF rotation flag. Safari's
// createImageBitmap ignores the flag and feeds OCR a 90°-rotated image that
// reads as nothing — decoding through an <img> element applies it everywhere.
async function loadOriented(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im); im.onerror = rej; im.src = url;
    });
    const cv = document.createElement("canvas");
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    cv.getContext("2d").drawImage(img, 0, 0);
    return cv;
  } finally { URL.revokeObjectURL(url); }
}

// Photos arrive upside down and tilted; OCR reads none of that. Rotating the
// source and retrying is cheap next to a failed scan. The base is pre-scaled
// so rotation never doubles the pixel work.
function rotSrc(bmp, deg, maxW){
  const base = Math.min(1, maxW / bmp.width);
  const w = Math.round(bmp.width * base), h = Math.round(bmp.height * base);
  const rad = deg * Math.PI / 180;
  const sin = Math.abs(Math.sin(rad)), cos = Math.abs(Math.cos(rad));
  const cv = document.createElement("canvas");
  cv.width  = Math.max(2, Math.round(w * cos + h * sin));
  cv.height = Math.max(2, Math.round(w * sin + h * cos));
  const x = cv.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, cv.width, cv.height);
  x.translate(cv.width / 2, cv.height / 2);
  x.rotate(rad);
  x.drawImage(bmp, -w / 2, -h / 2, w, h);
  return cv;
}

async function initScan(){
  const sel = $("sc-cycle");
  if (!sel.options.length){
    const { data: used } = await db.from("orders").select("cycle_code");
    const have = [...new Set((used||[]).map(o=>o.cycle_code))];
    if (cycle && !have.includes(cycle)) have.push(cycle);
    const { data } = await db.from("cycles").select("code,label")
      .in("code", have).order("code",{ascending:false});
    sel.innerHTML = (data||[]).map(c=>`<option value="${c.code}">${c.label||c.code}</option>`).join("");
    // Bags arrive a month after they are bought, so the last cycle Xurshid
    // chose is a better default than today's cycle.
    const lastCyc = localStorage.getItem("spo_sc_cycle");
    sel.value = (lastCyc && [...sel.options].some(o=>o.value===lastCyc)) ? lastCyc : cycle;
    sel.addEventListener("change", () => localStorage.setItem("spo_sc_cycle", sel.value));

    const st = $("sc-status");
    st.innerHTML = ["at_dubai","in_transit","at_erbil","out_for_delivery","delivered"]
      .map(v=>`<option value="${v}">${t().st[v]}</option>`).join("");
    const lastSt = localStorage.getItem("spo_sc_status");
    if (lastSt && [...st.options].some(o=>o.value===lastSt)) st.value = lastSt;
    st.addEventListener("change", () => localStorage.setItem("spo_sc_status", st.value));

    $("sc-files").addEventListener("change", runScan);
    $("sc-apply").addEventListener("click", applyScan);
    $("sc-extra").addEventListener("input", saveScanDraft);
  }
  await restoreScanDraft();
}

// A bag code is six identical letters then one digit: DDDDDD9. The letter I is
// never used. Anything that does not clean up to that shape is NOT a code —
// it goes to manual review. A wrong code saved silently is worse than no code.
const BAG_LETTERS = 6;

// Characters Tesseract habitually swaps for digits, applied only to the last slot.
const AS_DIGIT = { I:"1", L:"1", T:"7", O:"0", Q:"0", D:"0", S:"5", Z:"2",
                   B:"8", G:"6", A:"4", E:"3", J:"1" };
// ...and the reverse, for the letter block.
const AS_LETTER = { "1":null, "0":"O", "5":"S", "8":"B", "2":"Z", "6":"G" };

// Fold a messy read into the canonical shape, or return null if it can't be
// trusted. LLLLL13 -> LLLLLL3.  HHHHHI -> HHHHHH1.  DBO1 -> null (ambiguous).
function normalizeCode(raw){
  const s = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (s.length < 4 || s.length > 9) return null;

  let tail = s.slice(-1);
  if (!/\d/.test(tail)) tail = AS_DIGIT[tail] || null;
  if (tail === null) return null;

  const body = s.slice(0, -1);
  const votes = {};
  let letters = 0;
  for (const ch of body){
    const L = /[A-Z]/.test(ch) ? ch : AS_LETTER[ch];
    if (!L || L === "I") continue;      // I is not a valid card letter
    votes[L] = (votes[L] || 0) + 1;
    letters++;
  }
  if (letters < 3) return null;

  let best = null, bestN = 0;
  for (const L in votes) if (votes[L] > bestN){ best = L; bestN = votes[L]; }
  // Needs a clear majority. A three-way tie like D/B/O means we guessed wrong.
  if (!best || bestN / letters < 0.6) return null;

  return best.repeat(BAG_LETTERS) + tail;
}

const isCanonical = c => new RegExp(`^([A-HJ-Z])\\1{${BAG_LETTERS-1}}\\d$`).test(c || "");

// A hand-typed bag code: either the canonical DDDDDD9 (messy reads are folded)
// or the short sheet form like D4 / AB12. Returns null if neither.
function typedBagCode(raw){
  const s = toEn(String(raw || "")).toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (/^[A-Z]{1,8}\d{1,3}$/.test(s) && s.length <= 4) return s;
  const fixed = normalizeCode(s);
  if (fixed && isCanonical(fixed)) return fixed;
  return /^[A-Z]{1,8}\d{1,3}$/.test(s) ? s : null;
}

// One bag can hold several customers' items; the label then reads
// GC-340 D4-14-18. Split "14-18", "14+18", "14,18", "14 18" into [14, 18].
// Customer ids run in the hundreds, so anything past MAX_SEQ is not an id —
// it is a stray piece of a phone or invoice number.
const MAX_SEQ = 1999;
function parseSeqs(txt){
  const nums = toEn(String(txt || "")).split(/[^\d]+/).filter(Boolean)
    .map(n => parseInt(n, 10)).filter(n => n > 0 && n <= MAX_SEQ);
  return [...new Set(nums)];
}

// The label also carries phone numbers (+971507208201) and an invoice barcode
// (6080326267394). OCR happily hands those to us and "971" looks exactly like a
// customer id, so blank them out before we go looking. Line-bounded on purpose:
// \s would let a match run across the newline and swallow the GC-340 line.
function maskNoise(up){
  return up
    .replace(/[+][ \t]*\d[\d \t\-–—]{5,}/g, " ")            // +971 50 720 8201
    .replace(/\b0?0?9[ \t]*6[ \t]*4[\d \t\-–—]{5,}/g, " ")  // 00964 / 964 …
    .replace(/\b9[ \t]*7[ \t]*1[ \t]*\d[\d \t]{4,}/g, " ")  // 971 507 208 201
    .replace(/\d[\d \t]*\d/g, m =>                          // any 8+ digit run
      m.replace(/\D/g, "").length >= 8 ? " " : m)
    .replace(/\d{5,}/g, " ");                               // invoice / barcode
}

// Pull the code + customer id(s) out of whatever OCR returned.
// Returns every candidate it can see, best pattern first.
function extractCode(txt){
  const up = maskNoise(String(txt || "").toUpperCase().replace(/[|]/g, "1"));
  const out = [];
  const push = (raw, seqTxt, allowShort) => {
    // Right after "GC-340" a short sheet-style code (D4, AB12) is trusted as-is;
    // elsewhere only the canonical DDDDDD9 shape is safe enough to auto-accept.
    const s = String(raw || "");
    const code = (allowShort && /^[A-Z]{1,3}\d{1,2}$/.test(s)) ? s : normalizeCode(s);
    const seqs = parseSeqs(seqTxt);
    if (code && seqs.length) out.push({ code, seqs, raw: s });
  };
  const sweep = (re, allowShort) => { let m; while ((m = re.exec(up)) !== null) push(m[1], m[2], allowShort); };
  // \b ... (?!\d): an id must stand alone, never be a slice of a longer number.
  // (Lookbehind would read better but old iOS Safari throws on it.)
  const IDS = "(\\b\\d{1,4}(?:[ \\t]*[-–—+,][ \\t]*\\d{1,4})*(?!\\d))";

  // GC-340 <code>-<id>[-<id>...], the printed format
  sweep(new RegExp("G\\s*C\\s*[-–—]?\\s*3\\s*4\\s*0\\s+([A-Z0-9]{2,9})\\s*[-–—\\s]\\s*" + IDS, "g"), true);
  // code and id separated by a dash, GC prefix lost
  sweep(new RegExp("\\b([A-Z0-9]{4,9})\\s*[-–—]\\s*" + IDS, "g"));
  // last resort: code and id separated by whitespace only
  sweep(new RegExp("\\b([A-Z0-9]{4,9})[ \\t]+" + IDS, "g"));
  return out;
}

// Of everything OCR offered, take the reading whose customer ids are real
// orders. Without that check a phone fragment like 971 sails through looking
// perfectly valid. If nothing matches we still return the best guess, but
// flagged unsure so the photo goes to manual review instead of the save list.
function pickCandidate(cands, valid){
  if (!cands.length) return null;
  if (!valid || !valid.size) return { ...cands[0], sure: true };
  const all = cands.find(c => c.seqs.every(s => valid.has(s)));
  if (all) return { ...all, sure: true };
  const some = cands.find(c => c.seqs.some(s => valid.has(s)));
  if (some) return { ...some, seqs: some.seqs.filter(s => valid.has(s)), sure: true };
  return { ...cands[0], sure: false };
}

// Customer ids that actually exist, this cycle and the one before (bags arrive
// a month late, so last month's ids show up in every batch).
async function loadValidSeqs(cyc){
  const set = new Set();
  const codes = [cyc, prevCycle(cyc)].filter(Boolean);
  const { data } = await db.from("orders").select("seq").in("cycle_code", codes);
  (data || []).forEach(o => set.add(Number(o.seq)));
  return set;
}

async function runScan(e){
  const files = [...e.target.files];
  if (!files.length) return;

  scanRows = []; scanFails = []; revIdx = 0;
  if (revUrl){ URL.revokeObjectURL(revUrl); revUrl = null; }
  $("sc-progress").classList.remove("hide");
  $("sc-results").innerHTML = "";
  $("sc-review").innerHTML = "";
  $("sc-review").classList.add("hide");
  $("sc-apply").classList.add("hide");
  $("sc-manual").classList.add("hide");

  await freshSession();
  const valid = await loadValidSeqs($("sc-cycle").value);

  const worker = await Tesseract.createWorker("eng");
  await worker.setParameters({
    tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-+ ",
  });

  // top, bottom, threshold ("otsu" | "gray" | number), zoom, page-seg mode
  // 6 = one uniform block of text, 11 = sparse text anywhere in the frame.
  const PASSES = [
    [0.00, 1.00, "otsu", 1.6, "6"],
    [0.10, 0.50, "otsu", 2.2, "6"],
    [0.00, 1.00, "gray", 1.6, "11"],
    [0.10, 0.50,    130, 2.2, "6"],
    [0.35, 0.85, "otsu", 2.2, "6"],
    [0.00, 0.55,    150, 2.6, "6"],
    [0.00, 1.00, "otsu", 2.6, "11"]
  ];
  const MAX_W = 2400;   // canvases past this are slow and no more accurate
  let psmNow = null;

  for (let i = 0; i < files.length; i++){
    $("sc-bar").style.width = `${(i / files.length) * 100}%`;
    $("sc-count").textContent = `${t().reading} ${i + 1} / ${files.length}`;
    try {
      const bmp = await loadOriented(files[i]);
      let hit = null, guess = null;
      // upright first with the full pass list; then upside down, sideways and
      // slight tilts with the strongest passes only
      const FULL = [PASSES[0], PASSES[2]];
      const PLAN = [
        [0, PASSES], [180, [PASSES[0], PASSES[1], PASSES[2]]],
        [90, FULL], [270, FULL],
        [12, [PASSES[0]]], [-12, [PASSES[0]]], [192, [PASSES[0]]], [168, [PASSES[0]]]
      ];
      const srcCache = {};
      for (const [deg, plist] of PLAN){
      if (hit) break;
      // tilted frames must scan the whole image — crops assume upright layout
      const src = srcCache[deg] || (srcCache[deg] = deg === 0 ? bmp : rotSrc(bmp, deg, MAX_W));
      for (const [top0, bot0, cut, zoom, psm] of plist){
        const top = deg === 0 ? top0 : 0, bot = deg === 0 ? bot0 : 1;
        const cv = document.createElement("canvas");
        const sy = Math.round(src.height * top);
        const sh = Math.round(src.height * (bot - top));
        const scale = Math.min(zoom, MAX_W / src.width);
        cv.width  = Math.max(320, Math.round(src.width * scale));
        cv.height = Math.max(120, Math.round(sh * scale));
        const cx = cv.getContext("2d", { willReadFrequently: true });
        cx.drawImage(src, 0, sy, src.width, sh, 0, 0, cv.width, cv.height);
        const im = cx.getImageData(0, 0, cv.width, cv.height);
        const d = im.data;

        // Greyscale first, building a histogram as we go.
        const hist = new Uint32Array(256);
        for (let q = 0; q < d.length; q += 4){
          const g = (d[q]*0.299 + d[q+1]*0.587 + d[q+2]*0.114) | 0;
          d[q] = d[q+1] = d[q+2] = g;
          hist[g]++;
        }
        // A fixed cutoff dies on uneven phone lighting; Otsu picks its own.
        let level = 0;
        if (cut === "otsu") level = otsu(hist, cv.width * cv.height);
        else if (typeof cut === "number") level = cut;
        if (level > 0){
          for (let q = 0; q < d.length; q += 4){
            const v = d[q] < level ? 0 : 255;
            d[q] = d[q+1] = d[q+2] = v;
          }
        }
        cx.putImageData(im, 0, 0);

        const w = await getWorker();
        if (psm !== psmNow){ await w.setParameters({ tessedit_pageseg_mode: psm }); psmNow = psm; }
        const { data } = await w.recognize(cv);
        const pick = pickCandidate(extractCode(data.text), valid);
        if (pick && pick.sure){ hit = pick; break; }
        if (pick && !guess) guess = pick;   // keep the best unsure read for review
      }
      }
      if (hit){
        // the same bag photographed twice must not become two rows — but a
        // read that adds NOTHING may be a misread, so it goes to review
        const fresh = hit.seqs.filter(seq => !scanRows.some(r => r.code === hit.code && r.seq === seq));
        fresh.forEach(seq => scanRows.push({ code: hit.code, seq, raw: hit.raw, file: files[i].name }));
        if (!fresh.length) scanFails.push({ file: files[i], name: files[i].name, guess: hit, dup: true });
      }
      else scanFails.push({ file: files[i], name: files[i].name, guess });
      if (bmp.close) bmp.close();
    } catch (err){
      scanFails.push({ file: files[i], name: files[i].name });
    }
  }

  await worker.terminate();
  $("sc-bar").style.width = "100%";
  $("sc-progress").classList.add("hide");
  await showScan();
  saveScanDraft();
}

// 2608 -> 2607. Bags bought in one cycle physically arrive during the next one,
// so a batch of photos routinely contains last month's customer IDs.
function prevCycle(code){
  const y = parseInt(String(code).slice(0, 2), 10);
  const m = parseInt(String(code).slice(2), 10);
  if (isNaN(y) || isNaN(m)) return null;
  return m === 1 ? String(y - 1).padStart(2, "0") + "12"
                 : String(y).padStart(2, "0") + String(m - 1).padStart(2, "0");
}

async function showScan(){
  const cyc = $("sc-cycle").value;
  const seqs = [...new Set(scanRows.map(r => r.seq))];

  // Look up which orders these customer IDs belong to.
  const { data: orders } = await db.from("orders")
    .select("seq,order_code,customers(instagram_username)")
    .eq("cycle_code", cyc).in("seq", seqs.length ? seqs : [-1]);
  const byseq = {};
  (orders || []).forEach(o => byseq[o.seq] = o);

  // Anything missing here may simply belong to the previous cycle.
  const missing = seqs.filter(s => !byseq[s]);
  const prev = prevCycle(cyc);
  let inPrev = {};
  if (missing.length && prev){
    const { data: po } = await db.from("orders")
      .select("seq,order_code").eq("cycle_code", prev).in("seq", missing);
    (po || []).forEach(o => inPrev[o.seq] = o);
  }
  const prevN = Object.keys(inPrev).length;

  const rows = scanRows.map(r => {
    const o = byseq[r.seq];
    const p = !o && inPrev[r.seq];
    const label = o ? (o.customers?.instagram_username || "—")
      : p ? `<span style="color:#EF9F27">${t().scOther}</span>`
          : `<span style="color:#F09595">${t().scNoOrder}</span>`;
    return `<div class="row" style="cursor:default">
      <div class="l">
        <div class="c num">${r.code}</div>
        <div class="u">${label}</div>
      </div>
      <div class="b num" style="font-size:13px">${o ? o.order_code : r.seq}</div>
    </div>`;
  }).join("");

  const prevBox = prevN
    ? `<div style="background:rgba(239,159,39,.10);border:1px solid rgba(239,159,39,.35);
         border-radius:12px;padding:14px;margin-bottom:14px">
         <div style="color:#EF9F27;font-size:13px;line-height:1.8;margin-bottom:10px">
           ${prevN} × ${t().scOther} (${prev})</div>
         <div style="color:var(--mute);font-size:12px;line-height:1.7;margin-bottom:10px">
           ${t().scPrevAuto}</div>
         <button class="btn" id="sc-switch" style="margin:0;padding:10px">
           ${t().scSwitch} ${prev}</button>
       </div>`
    : "";

  $("sc-results").innerHTML =
    `<div class="sbar" style="margin-bottom:14px">
       <button class="on">${t().scFound}<b>${scanRows.length}</b></button>
       ${scanFails.length ? `<button>${t().scFailed}<b>${scanFails.length}</b></button>` : ""}
     </div>` + prevBox + rows;

  if (prevN) $("sc-switch").addEventListener("click", () => {
    $("sc-cycle").value = prev;
    localStorage.setItem("spo_sc_cycle", prev);
    showScan();
  });

  revIdx = 0;
  renderReview();
  $("sc-manual").classList.remove("hide");
  $("sc-apply").classList.remove("hide");
}

// ---------- Manual review of the photos OCR could not read ----------
// One photo on screen at a time with the code box already focused.
// Type, press Enter, the next photo loads. No hunting through Finder.
function renderReview(){
  const box = $("sc-review");
  if (revUrl){ URL.revokeObjectURL(revUrl); revUrl = null; }

  if (!scanFails.length){ box.classList.add("hide"); box.innerHTML = ""; return; }
  box.classList.remove("hide");

  if (revIdx >= scanFails.length) revIdx = 0;   // skipped items cycle back

  const item = scanFails[revIdx];
  // A read we could not tie to a real order: show it prefilled so it can be
  // corrected rather than typed from scratch.
  const g = item.guess;
  revUrl = URL.createObjectURL(item.file);
  box.innerHTML = `
    <div style="background:rgba(226,75,74,.06);border:1px solid rgba(226,75,74,.28);
      border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="color:#F09595;font-size:13px">${t().revTitle}</span>
        <span class="num" style="color:var(--mute);font-size:12px">
          ${revIdx + 1} ${t().revOf} ${scanFails.length}</span>
      </div>
      <img src="${revUrl}" alt="" style="width:100%;max-height:340px;object-fit:contain;
        background:#000;border-radius:8px;margin-bottom:12px">
      ${item.dup ? `<div style="color:#EFC368;font-size:12.5px;line-height:1.8;margin-bottom:8px">${t().revTaken}</div>` : ""}
      <div style="display:flex;gap:10px">
        <div class="f" style="flex:1;margin-bottom:8px"><label>${t().revBag}</label>
          <input id="rv-code" dir="ltr" autocomplete="off" spellcheck="false" value="${g ? g.code : ""}"
            style="font-family:Archivo,monospace;text-transform:uppercase" placeholder="DDDDDD9"></div>
        <div class="f" style="flex:1;margin-bottom:8px"><label>${t().revSeq}</label>
          <input id="rv-seq" dir="ltr" inputmode="tel" autocomplete="off" value="${g ? g.seqs.join("-") : ""}"
            placeholder="446  /  14-18  /  14*18"></div>
      </div>
      <div id="rv-err" style="color:#F09595;font-size:12px;min-height:16px;margin-bottom:8px"></div>
      <div style="display:flex;gap:10px">
        <button class="btn" id="rv-save" style="margin:0;flex:2">${t().revSave}</button>
        <button class="btn" id="rv-skip" style="margin:0;flex:1;background:transparent;
          border:1px solid var(--line);color:var(--mute)">${t().revSkip}</button>
        <button class="btn" id="rv-drop" style="margin:0;flex:1;background:transparent;
          border:1px solid rgba(226,75,74,.4);color:#F09595">${t().revDrop}</button>
      </div>
    </div>`;

  const code = $("rv-code"), seq = $("rv-seq"), err = $("rv-err");
  const clear = () => { err.textContent = ""; };
  code.addEventListener("input", clear);
  seq.addEventListener("input", clear);

  const next = () => { revIdx++; renderReview(); };

  const save = () => {
    const fixed = typedBagCode(code.value);
    const seqs = parseSeqs(seq.value);
    if (!fixed){ err.textContent = t().revBad; code.focus(); return; }
    if (!seqs.length){ err.textContent = t().revBad; seq.focus(); return; }
    // "14-18" = two customers sharing this bag → one row each (skip repeats)
    const fresh = seqs.filter(n => !scanRows.some(r => r.code === fixed && r.seq === n));
    if (!fresh.length){ err.textContent = t().revTaken; return; }
    fresh.forEach(n => scanRows.push({ code: fixed, seq: n, file: scanFails[revIdx].name }));
    scanFails.splice(revIdx, 1);
    renderReview();
    showScanCounts();
    saveScanDraft();
  };

  $("rv-save").addEventListener("click", save);
  $("rv-skip").addEventListener("click", next);
  $("rv-drop").addEventListener("click", () => {
    scanFails.splice(revIdx, 1);
    renderReview(); showScanCounts(); saveScanDraft();
  });
  [code, seq].forEach(el => el.addEventListener("keydown", ev => {
    if (ev.key === "Enter"){ ev.preventDefault(); save(); }
  }));
  code.focus();
}

// Keep the found/failed pills honest as rows move out of the review queue.
function showScanCounts(){
  const bar = $("sc-results").querySelector(".sbar");
  if (!bar) return;
  bar.innerHTML = `<button class="on">${t().scFound}<b>${scanRows.length}</b></button>` +
    (scanFails.length ? `<button>${t().scFailed}<b>${scanFails.length}</b></button>` : "");
}

async function applyScan(){
  const extra = [], bad = [];
  $("sc-extra").value.split(/\n/).forEach(line => {
    if (!line.trim()) return;
    // "DDDDDD9 446"  or  "D4 14-18"  (several customers in one bag)
    const m = toEn(line).toUpperCase().match(/([A-Z0-9]{1,10})[\s,\-]+(\d[\d\s,+\-–—]*)$/);
    const code = m && typedBagCode(m[1]);
    const seqs = m ? parseSeqs(m[2]) : [];
    if (code && seqs.length) seqs.forEach(seq => extra.push({ code, seq }));
    else bad.push(line.trim());
  });
  if (bad.length) return say("sc-msg", `${t().revBad}: ${bad.join(" · ")}`, "err");

  const uniq = new Map();
  [...scanRows.map(r=>({code:r.code, seq:r.seq})), ...extra]
    .forEach(r => uniq.set(`${r.code}\u00b7${r.seq}`, r));
  const all = [...uniq.values()];
  if (!all.length) return;

  // Scrub the payload before it leaves the browser. A stray value here comes
  // back from Postgres as something unreadable like «malformed array literal»,
  // which says nothing about which row was at fault.
  const rows = [], junk = [];
  all.forEach(r => {
    const code = String(r.code == null ? "" : r.code).toUpperCase().trim();
    const seq = Number(r.seq);
    if (/^[A-Z]{1,8}\d{1,3}$/.test(code) && Number.isInteger(seq) && seq > 0 && seq <= MAX_SEQ)
      rows.push({ code, seq });
    else junk.push(`${r.code == null ? "?" : r.code}·${r.seq == null ? "?" : r.seq}`);
  });
  if (junk.length){
    console.error("apply_bag_scan: rejected rows", junk);
    return say("sc-msg", `${t().revBad}: ${junk.slice(0, 8).join(" · ")}`, "err");
  }

  const p_cycle = $("sc-cycle").value, p_status = $("sc-status").value;
  if (!p_cycle || !p_status) return say("sc-msg", `${t().revBad}: ${t().cycle} / ${t().setStatus}`, "err");

  // One batch of photos routinely mixes two months: bags bought in July arrive
  // together with August's. Split by which cycle actually has the customer id —
  // ids of the chosen month stay there, ids only found in the month before go
  // there instead. Unknown ids stay with the chosen month so the server can
  // report them as missing.
  const b = $("sc-apply"); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  const done = () => { b.disabled = false; b.textContent = t().applyBags; };

  // A delivered or cancelled order is closed: it must never receive a bag,
  // or the scan would drag it back from "delivered" to "at Erbil". So July's
  // finished 250 is skipped and August's open 250 gets the bag.
  const CLOSED = ["delivered", "cancelled"];
  const sets = async cyc => {
    const { data } = await db.from("orders").select("id,seq,status,bags_code").eq("cycle_code", cyc);
    const open = new Set(), any = new Set(), codes = {}, info = {};
    (data || []).forEach(o => {
      const q = Number(o.seq);
      any.add(q);
      if (!CLOSED.includes(o.status)) open.add(q);
      if (o.bags_code) codes[q] = String(o.bags_code).toUpperCase();
      info[q] = { id: o.id, status: o.status,
        expected: (String(o.bags_code || "").toUpperCase().match(/[A-Z]{1,8}[0-9]{1,3}/g) || []) };
    });
    return { open, any, codes, info };
  };
  const prev = prevCycle(p_cycle);
  const cur = await sets(p_cycle);
  const prv = prev ? await sets(prev) : { open: new Set(), any: new Set(), codes: {} };

  // When the same customer number is open in BOTH months, the sheet decides:
  // each order carries its expected bag codes, and the month whose sheet lists
  // this exact code wins. Only when neither sheet knows the code does the
  // dropdown month win by default.
  const listed = (m, r) => m.codes[r.seq] &&
    new RegExp(`(^|[^A-Z0-9])${r.code}([^A-Z0-9]|$)`).test(m.codes[r.seq]);

  const nowRows = [], prevRows = [], closedRows = [];
  rows.forEach(r => {
    const inCur = cur.open.has(r.seq) && listed(cur, r);
    const inPrv = prv.open.has(r.seq) && listed(prv, r);
    if (inCur) nowRows.push(r);
    else if (inPrv) prevRows.push(r);
    else if (cur.open.has(r.seq)) nowRows.push(r);
    else if (prv.open.has(r.seq)) prevRows.push(r);
    else if (cur.any.has(r.seq) || prv.any.has(r.seq)) closedRows.push(r);
    else nowRows.push(r);   // unknown id: send it so the server reports it missing
  });

  if (!nowRows.length && !prevRows.length){
    done();
    return say("sc-msg", `${t().scClosed}: ${closedRows.map(r => r.seq).join(" ")}`, "err");
  }
  if (!confirm((prevRows.length
      ? `${nowRows.length} (${p_cycle}) + ${prevRows.length} (${prev})?`
      : `${rows.length - closedRows.length}?`)
      + (closedRows.length ? ` (${t().scClosed}: ${closedRows.length})` : ""))){ done(); return; }

  // An order's status only advances once ALL its sheet-listed bags are in.
  // Bags of a half-arrived order still save, but under the order's CURRENT
  // status, so the customer never sees "at Erbil" while a bag is missing.
  // The same grouping also stops a scan from dragging an order backwards.
  const affected = [];
  [[p_cycle, nowRows, cur], [prev, prevRows, prv]].forEach(([cyc, part, m]) =>
    part.forEach(r => { const o = m.info[r.seq]; if (o?.id) affected.push(o.id); }));
  const existing = {};
  if (affected.length){
    const { data: eb } = await db.from("bags").select("order_id,code").in("order_id", affected);
    (eb || []).forEach(b => (existing[b.order_id] = existing[b.order_id] || new Set()).add(String(b.code).toUpperCase()));
  }
  const RANK = q => FLOW.indexOf(q);
  const calls = {}, partial = [];
  [[p_cycle, nowRows, cur], [prev, prevRows, prv]].forEach(([cyc, part, m]) => {
    part.forEach(r => {
      const o = m.info[r.seq] || {};
      let target = p_status;
      if (o.status && RANK(o.status) > RANK(p_status)) target = o.status;   // never regress
      else if (o.expected && o.expected.length){
        const covered = new Set(existing[o.id] ? [...existing[o.id]] : []);
        part.forEach(x => { if (x.seq === r.seq) covered.add(x.code); });
        const missingBags = o.expected.filter(c => !covered.has(c));
        if (missingBags.length){
          target = o.status || p_status;
          if (!partial.some(x => x.seq === r.seq && x.cyc === cyc))
            partial.push({ seq: r.seq, cyc, have: o.expected.length - missingBags.length, total: o.expected.length });
        }
      }
      const k = `${cyc}\u0001${target}`;
      (calls[k] = calls[k] || { cyc, status: target, rows: [] }).rows.push(r);
    });
  });

  let applied = 0, missing = [];
  for (const c of Object.values(calls)){
    const { data, error } = await db.rpc("apply_bag_scan",
      { p_cycle: c.cyc, p_status: c.status, p_rows: c.rows });
    if (error){
      console.error("apply_bag_scan failed", c, error);
      saveScanDraft();
      done();
      return say("sc-msg", `${c.cyc}: ${error.message}`, "err");
    }
    const r = data[0];
    applied += r.applied || 0;
    if (r.missing) missing.push(r.missing);
  }
  done();
  say("sc-msg",
    `${applied} ✓` +
    (prevRows.length ? ` · ${p_cycle}: ${nowRows.length} · ${prev}: ${prevRows.length}` : "") +
    (closedRows.length ? ` · ${t().scClosed}: ${closedRows.map(r => r.seq).join(" ")}` : "") +
    (partial.length ? ` · ${t().scPartial}: ${partial.map(x => `${x.seq}(${x.have}/${x.total})`).join(" ")}` : "") +
    (missing.length ? ` · ${t().scNoOrder}: ${missing.join(" ")}` : ""), "ok", 0);
  clearScanDraft();
  scanRows = []; scanFails = []; revIdx = 0;
  if (revUrl){ URL.revokeObjectURL(revUrl); revUrl = null; }
  $("sc-results").innerHTML = "";
  $("sc-review").innerHTML = "";
  $("sc-review").classList.add("hide");
  $("sc-extra").value = "";
  $("sc-files").value = "";
  $("sc-apply").classList.add("hide");
  $("sc-manual").classList.add("hide");
}


// ---------- Bag codes from the sheet ----------
// A bag code is letters then digits, up to 10 chars. Anything else is a note.
function parseBagPaste(){
  const out = [];
  splitTsv($("bg-box").value).forEach(c => {
    const seq = parseInt(toEn(c[0]||"").replace(/[^\d]/g,""), 10);
    if (!seq) return;
    const rest = (c.slice(1).join(" ") || "").toUpperCase();
    const codes = [], notes = [];
    rest.split(/[+,\n\r\t]+/).forEach(part => {
      part = part.trim();
      if (!part) return;
      // take a leading bag code, treat the remainder as a note
      const m = part.match(/^([A-Z]{1,8}\d{1,3})\b/);
      if (m){
        codes.push(m[1]);
        const tail = part.slice(m[1].length).trim();
        if (tail) notes.push(tail);
      } else {
        notes.push(part);
      }
    });
    if (codes.length || notes.length)
      out.push({ seq, codes: [...new Set(codes)], note: notes.join(" ") || null });
  });
  return out;
}

function previewBags(){
  const rows = parseBagPaste();
  $("bg-n").textContent = rows.reduce((a,r)=>a+r.codes.length, 0);
  $("bg-preview").innerHTML = rows.slice(0,3).map(r =>
    `<div class="row" style="cursor:default"><div class="l">
       <div class="c num">${cycle}-${String(r.seq).padStart(4,"0")}</div>
       <div class="u num" dir="ltr">${r.codes.join(" · ") || "—"}</div>
       ${r.note ? `<div class="s">${r.note}</div>` : ""}
     </div><div class="b num">${r.codes.length}</div></div>`).join("");
}

let skRows = [], skAttachId = null, skInit = false;

async function initShko(){

async function loadShko(){

function shipRow(r, done){

    <div class="l" style="display:flex;align-items:center;gap:10px">
